<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kage Translate</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f7fa;color:#1a1a1a;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto}
header{text-align:center;margin-bottom:24px}
header h1{font-size:28px;color:#1e40af}
header p{color:#64748b;margin-top:6px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:20px}
.row{display:flex;gap:12px;margin-bottom:16px}
.row>div{flex:1}
label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
select,button,textarea{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff}
.upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;background:#f8fafc}
.upload-area p{color:#64748b}
.upload-area small{color:#94a3b8}
#preview{max-width:100%;max-height:250px;border-radius:10px;margin-top:14px;display:none}
.btn{background:#1e40af;color:#fff;border:none;font-weight:600;cursor:pointer;margin-top:10px}
.btn:disabled{background:#94a3b8}
.btn-secondary{background:#64748b}
.status{text-align:center;padding:12px;border-radius:10px;margin-top:14px;font-size:14px;display:none}
.status.loading{background:#eff6ff;color:#1e40af;display:block}
.status.error{background:#fef2f2;color:#b91c1c;display:block}
.result-section{display:none}
.result-section.show{display:block}
#resultCanvas{width:100%;height:auto;border-radius:8px;display:block;background:#eee}
textarea{line-height:1.4;resize:vertical}
.actions{display:flex;gap:10px;margin-top:12px}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}
.item textarea.en{min-height:56px;font-size:13px;color:#475569;background:#f8fafc}
.item textarea.uz{min-height:80px}
.mini{width:auto;padding:8px 12px;font-size:13px;margin:6px 0 10px;background:#e2e8f0;color:#1e293b;border:0;border-radius:8px;cursor:pointer}
footer{text-align:center;margin-top:30px;color:#94a3b8;font-size:13px}
.alt{width:100%;text-align:left;padding:8px 10px;font-size:13px;margin-top:6px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;color:#1e293b;cursor:pointer;line-height:1.4}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Kage Translate</h1>
    <p>English ↔ O‘zbek rasm tarjimasi</p>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label>Qaysi tildan</label>
        <select id="sourceLang"><option value="eng">English</option><option value="uzb">O‘zbek</option></select>
      </div>
      <div>
        <label>Qaysi tilga</label>
        <select id="targetLang"><option value="uzb">O‘zbek</option><option value="eng">English</option></select>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <p>Rasmni bosib tanlang</p>
      <small>jpg, png, webp</small>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <img id="preview" alt="Preview">
    </div>

    <button class="btn" id="translateBtn" disabled>Tarjima qilish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card result-section" id="resultSection">
    <label>Natija</label>
    <canvas id="resultCanvas"></canvas>
    <div class="actions">
      <button class="btn" id="applyBtn">Rasmga qayta joylash</button>
      <button class="btn btn-secondary" id="downloadBtn">Rasmni saqlash</button>
    </div>
    <label style="margin-top:18px">Tarjimani tahrirlash</label>
    <div id="items"></div>
  </div>

  <footer>Kage Translate • Faqat tekin • v18</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const uploadArea=$('uploadArea'),fileInput=$('fileInput'),preview=$('preview'),
      translateBtn=$('translateBtn'),statusEl=$('status'),resultSection=$('resultSection'),
      sourceLang=$('sourceLang'),targetLang=$('targetLang'),canvas=$('resultCanvas'),itemsBox=$('items');
let selectedUrl=null,state=null;

uploadArea.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

async function handleFile(file){
  if(!file.type.startsWith('image/')) return showStatus('Faqat rasm yuklash mumkin','error');
  try{
    const buf=await file.arrayBuffer();
    const blob=new Blob([buf],{type:file.type});
    if(selectedUrl) URL.revokeObjectURL(selectedUrl);
    selectedUrl=URL.createObjectURL(blob);
    preview.src=selectedUrl;
    preview.style.display='block';
    translateBtn.disabled=false;
    resultSection.classList.remove('show');
    showStatus('','');
  }catch(e){ showStatus('Faylni o‘qib bo‘lmadi. Rasmni qayta tanlang.','error'); }
}
function showStatus(msg,type){statusEl.textContent=msg;statusEl.className='status '+(type||'');}
function loadImg(url){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('Rasm ochilmadi. Rasmni qayta tanlang.'));
    img.src=url;
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function decodeEnt(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value;}
const lumOf=(d,p)=>(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;

// ---------- Tarjima ----------
async function translate(text,from,to){
  let t=text.replace(/\s+/g,' ').trim();
  {const lt=t.replace(/[^\p{L}]/gu,''),up=lt.replace(/[^\p{Lu}]/gu,'');
   if(lt.length&&up.length/lt.length>=0.7) t=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}
  t=t.slice(0,450);
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);
    const j=await r.json();
    const g=(j[0]||[]).map(x=>x[0]).join('');
    if(g) return g;
  }catch(e){}
  for(let k=0;k<2;k++){
    try{
      const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`);
      const j=await r.json();
      const res=j.responseData&&j.responseData.translatedText;
      if(res&&!/MYMEMORY WARNING|QUERY LENGTH/i.test(res)) return decodeEnt(res);
    }catch(e){}
    await sleep(600);
  }
  return null;
}
function polish(tr,to){
  tr=tr.replace(/\s+/g,' ').trim();
  if(to==='uz') tr=tr.replace(/([OoGg])['’‘`´]/g,'$1ʻ');
  return tr;
}

// ---------- Bir nechta tarjimon (Google, Bing, MyMemory) ----------
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('vaqt')),ms||9000))]);
function prepEn(text,from){
  let t=text.replace(/\s+/g,' ').trim();
  const lt=t.replace(/[^\p{L}]/gu,''),up=lt.replace(/[^\p{Lu}]/gu,'');
  if(lt.length&&up.length/lt.length>=0.7){
    t=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
    if(from==='en') t=t.replace(/\bi\b/g,'I');
  }
  return t.slice(0,450);
}
async function trGoogle(t,from,to){
  const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);
  const j=await r.json();return (j[0]||[]).map(x=>x[0]).join('');
}
let msTok=null,msExp=0;
async function trBing(t,from,to){
  if(!msTok||Date.now()>msExp){const a=await fetch('https://edge.microsoft.com/translate/auth');msTok=await a.text();msExp=Date.now()+8*60*1000;}
  const r=await fetch(`https://api-edge.cognitive.microsofttranslator.com/translate?from=${from}&to=${to}&api-version=3.0`,
    {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+msTok},body:JSON.stringify([{Text:t}])});
  const j=await r.json();return j[0].translations[0].text;
}
async function trMyMemory(t,from,to){
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`);
  const j=await r.json();const res=j.responseData&&j.responseData.translatedText;
  if(!res||/MYMEMORY WARNING|QUERY LENGTH/i.test(res)) throw new Error('mm');
  return decodeEnt(res);
}
async function trLingva(t,from,to){
  const r=await fetch(`https://lingva.ml/api/v1/${from}/${to}/${encodeURIComponent(t)}`);
  const j=await r.json();return j.translation;
}
const grams=s=>{s=s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ');const g=new Set();for(let i=0;i<s.length-2;i++)g.add(s.slice(i,i+3));return g;};
const dice=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;for(const x of a)if(b.has(x))n++;return 2*n/(a.size+b.size);};
function pickBest(c){ // eng ko'p tarjimonga o'xshash variant (konsensus)
  if(c.length<3) return c[0].t;
  const g=c.map(x=>grams(x.t));let bi=0,bs=-1;
  c.forEach((x,i)=>{let sc=0;c.forEach((y,j)=>{if(i!==j)sc+=dice(g[i],g[j]);});sc=sc/(c.length-1)+(i===0?0.03:0);if(sc>bs){bs=sc;bi=i;}});
  return c[bi].t;
}
async function translateAll(text,from,to){
  const t=prepEn(text,from);
  const src=[['Google',trGoogle],['Bing',trBing],['MyMemory',trMyMemory]];
  const rs=await Promise.all(src.map(([n,f])=>withTimeout(f(t,from,to)).then(x=>({n,t:polish((x||'').trim(),to)})).catch(()=>null)));
  let c=rs.filter(r=>r&&r.t&&r.t.toLowerCase()!==t.toLowerCase());
  if(!c.length){try{const x=await withTimeout(trLingva(t,from,to));if(x)c=[{n:'Lingva',t:polish(x.trim(),to)}];}catch(e){}}
  if(!c.length) return null;
  const m=new Map();
  for(const r of c){const k=r.t.toLowerCase();if(m.has(k))m.get(k).n+=' + '+r.n;else m.set(k,{n:r.n,t:r.t});}
  return {best:pickBest(c),alts:[...m.values()]};
}

// ---------- 1) Matnni topish: harflar -> qatorlar -> bloklar ----------
function findTextBlocks(ctx,W,H){
  const sD=Math.min(1,1400/W),Wd=Math.max(1,Math.round(W*sD)),Hd=Math.max(1,Math.round(H*sD)),N=Wd*Hd;
  const c=document.createElement('canvas');c.width=Wd;c.height=Hd;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.imageSmoothingQuality='high';
  cx.drawImage(ctx.canvas,0,0,Wd,Hd);
  const d=cx.getImageData(0,0,Wd,Hd).data,g=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4) g[i]=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
  const INK=115,lab=new Int32Array(N),stack=new Int32Array(N),isLetter=new Uint8Array((N>>1)+4),letters=[];
  const maxH=Math.max(24,Math.min(110,Math.round(Wd*0.07)));
  let id=0;
  for(let s=0;s<N;s++){
    if(lab[s]||g[s]>=INK) continue;
    id++;
    let sp=0;stack[sp++]=s;lab[s]=id;
    let x0=Wd,y0=Hd,x1=0,y1=0,area=0;
    while(sp){
      const i=stack[--sp],x=i%Wd,y=(i-x)/Wd;area++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=Hd)continue;
        for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=Wd)continue;
          const j=yy*Wd+xx;if(!lab[j]&&g[j]<INK){lab[j]=id;stack[sp++]=j;}}}
    }
    const w=x1-x0+1,h=y1-y0+1,fr=area/(w*h);
    const sizeOk=h<=maxH&&w<=Math.min(10*h+10,320);
    let ok=area>=8&&h>=5&&sizeOk&&fr>=0.1&&(fr<=0.92||w<=0.4*h)&&h/w<=14;
    if(ok){ // atrofi yorug' bo'lishi kerak (pufakcha, izoh qutisi)
      const smp=[],rx0=Math.max(0,x0-3),ry0=Math.max(0,y0-3),rx1=Math.min(Wd-1,x1+3),ry1=Math.min(Hd-1,y1+3);
      const sx=Math.max(1,Math.floor((rx1-rx0)/6)),sy=Math.max(1,Math.floor((ry1-ry0)/6));
      for(let x=rx0;x<=rx1;x+=sx){smp.push(g[ry0*Wd+x],g[ry1*Wd+x]);}
      for(let y=ry0;y<=ry1;y+=sy){smp.push(g[y*Wd+rx0],g[y*Wd+rx1]);}
      smp.sort((a,b)=>a-b);ok=smp[smp.length>>1]>=150;
    }
    isLetter[id]=ok?1:(sizeOk?2:0); // 1 harf, 2 kichik belgi (o'chiriladi), 0 katta chiziq (himoyalanadi)
    if(ok) letters.push({x0,y0,x1,y1,h});
  }
  const med=a=>{const t=[...a].sort((u,v)=>u-v);return t[t.length>>1];};
  letters.sort((a,b)=>a.x0-b.x0);
  const lines=[];
  for(const c of letters){
    let best=null;
    for(const ln of lines){
      const gap=c.x0-ln.x1;
      if(gap>1.5*ln.h||gap<-0.35*ln.h) continue;
      if(Math.min(ln.y1,c.y1)-Math.max(ln.y0,c.y0)<0.5*Math.min(ln.h,c.h)) continue;
      if(c.h<0.55*ln.h||c.h>1.8*ln.h) continue;
      best=ln;break;
    }
    if(best){best.hs.push(c.h);best.n++;best.x1=Math.max(best.x1,c.x1);best.y0=Math.min(best.y0,c.y0);best.y1=Math.max(best.y1,c.y1);best.h=med(best.hs);}
    else lines.push({hs:[c.h],n:1,x0:c.x0,x1:c.x1,y0:c.y0,y1:c.y1,h:c.h});
  }
  const ls=lines.filter(l=>l.n>=2&&l.x1-l.x0>=1.2*l.h).sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
  const blocks=[];
  for(const ln of ls){
    let bk=null;
    for(const b of blocks){
      const last=b.lines[b.lines.length-1],gap=ln.y0-last.y1;
      if(gap>1.0*b.h||gap<-0.4*b.h||ln.h<0.7*b.h||ln.h>1.4*b.h) continue;
      if(Math.min(b.x1,ln.x1)-Math.max(b.x0,ln.x0)<0.25*Math.min(b.x1-b.x0,ln.x1-ln.x0)) continue;
      bk=b;break;
    }
    if(bk){bk.lines.push(ln);bk.x0=Math.min(bk.x0,ln.x0);bk.x1=Math.max(bk.x1,ln.x1);bk.y1=Math.max(bk.y1,ln.y1);bk.h=med(bk.lines.map(l=>l.h));bk.n+=ln.n;}
    else blocks.push({lines:[ln],x0:ln.x0,x1:ln.x1,y0:ln.y0,y1:ln.y1,h:ln.h,n:ln.n});
  }
  const out=blocks.filter(b=>b.n>=3&&b.x1-b.x0>=2.5*b.h).sort((a,b)=>a.y0-b.y0||a.x0-b.x0).slice(0,90);
  for(const b of out){ // qator oralig'i va tekislash
    const cy=b.lines.map(l=>(l.y0+l.y1)/2),pitches=[];
    for(let i=1;i<cy.length;i++) pitches.push((cy[i]-cy[i-1])/b.h);
    b.pitchR=Math.min(2.4,Math.max(1.35,pitches.length?med(pitches):1.7));
    const sd=a=>{const m=a.reduce((p,q)=>p+q,0)/a.length;return Math.sqrt(a.reduce((p,q)=>p+(q-m)*(q-m),0)/a.length);};
    b.align=(b.lines.length>1&&sd(b.lines.map(l=>l.x0))<0.6*sd(b.lines.map(l=>(l.x0+l.x1)/2)))?'left':'center';
  }
  return {blocks:out,sD,Wd,Hd,lab,isLetter};
}

// Blok atrofini tayyorlash: fon, matn rangi, himoyalangan piksellar (chiziq, rasm)
function prepBlock(ctx,det,b){
  const {sD,Wd,lab,isLetter}=det,cap=b.h/sD,pad=Math.round(0.4*cap)+2;
  const tx0=Math.floor(b.x0/sD),ty0=Math.floor(b.y0/sD),tx1=Math.ceil((b.x1+1)/sD),ty1=Math.ceil((b.y1+1)/sD);
  const X0=Math.max(0,tx0-pad),Y0=Math.max(0,ty0-pad),X1=Math.min(ctx.canvas.width,tx1+pad),Y1=Math.min(ctx.canvas.height,ty1+pad);
  const w=X1-X0,h=Y1-Y0,N=w*h,px=ctx.getImageData(X0,Y0,w,h).data;
  const ls=[];for(let i=0;i<N;i+=7) ls.push(lumOf(px,i*4));ls.sort((u,v)=>u-v);
  const bgL=ls[Math.floor(ls.length*0.7)];
  const prot=new Uint8Array(N);
  for(let y=0;y<h;y++){const dy=Math.min(det.Hd-1,Math.floor((Y0+y)*sD));
    for(let x=0;x<w;x++){const l=lab[dy*Wd+Math.min(Wd-1,Math.floor((X0+x)*sD))];if(l>0&&isLetter[l]===0)prot[y*w+x]=1;}}
  const R=[],G=[],B=[],ink=[];
  for(let i=0;i<N;i++){ if(prot[i]) continue; const p=i*4,l=lumOf(px,p);
    if(l>=bgL*0.85){ if(i%3===0){R.push(px[p]);G.push(px[p+1]);B.push(px[p+2]);} }
    else if(l<bgL*0.5) ink.push([l,p]); }
  const md=a=>a.length?a.sort((u,v)=>u-v)[a.length>>1]:255;
  const fill=[md(R),md(G),md(B)];
  let color='#000';
  if(ink.length>=15){ink.sort((u,v)=>u[0]-v[0]);const k=Math.max(15,Math.floor(ink.length*0.4));let r=0,g=0,bl=0;
    for(let j=0;j<k;j++){const p=ink[j][1];r+=px[p];g+=px[p+1];bl+=px[p+2];}
    color=`rgb(${Math.round(r/k)},${Math.round(g/k)},${Math.round(bl/k)})`;}
  const ep=Math.round(0.22*cap)+1;
  return {X0,Y0,w,h,bgL,prot,fill,color,cap,tx0,ty0,tx1,ty1,
    rects:b.lines.map(l=>({x0:Math.max(0,Math.floor(l.x0/sD)-ep-X0),y0:Math.max(0,Math.floor(l.y0/sD)-ep-Y0),x1:Math.min(w,Math.ceil((l.x1+1)/sD)+ep-X0),y1:Math.min(h,Math.ceil((l.y1+1)/sD)+ep-Y0)})),
    nLines:b.lines.length,pitchR:b.pitchR,align:b.align,px};
}

// ---------- OCR natijasi haqiqiy matnga o'xshaydimi ----------
const SHORTW=new Set(['no','oh','ah','uh','ok','hi','go','so','me','we','he','it','is','in','on','to','of','or','up','if','by','my','as','at','be','do','an','am','us','i','a']);
function plausible(txt,data){
  const toks=txt.split(' ').filter(Boolean);
  const good=toks.filter(w=>{
    const l=w.replace(/[^\p{L}]/gu,'');
    return (l.length>=3&&/[aeiouyAEIOUY]/.test(l))||(l.length>=1&&l.length<=2&&SHORTW.has(l.toLowerCase()));
  });
  if(!good.length||good.length/toks.length<0.5) return false;
  const ws=data.words||(data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])));
  if(!ws.length) return data.confidence>=40;
  return ws.filter(w=>w.confidence>=55&&w.text.replace(/[^\p{L}]/gu,'').length>=2).length>=1;
}

// ---------- Matnni asl joyiga, asl ko'rinishida joylash ----------
const FONT=s=>`bold ${s}px "Comic Sans MS","Segoe UI",Roboto,Arial,sans-serif`;
function layoutRect(ctx,text,rw,rh,size0,pitchR){
  const words=text.split(' ').filter(Boolean);
  const mk=(size,forced)=>{
    ctx.font=FONT(size);
    const cap=size*0.72,pitch=Math.max(cap*1.3,pitchR*cap);
    let mw=0;for(const wd of words) mw=Math.max(mw,ctx.measureText(wd).width);
    if(mw>rw&&!forced) return null;
    const wrap=W=>{const L=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(!cur||ctx.measureText(t).width<=W)cur=t;else{L.push(cur);cur=wd;}}if(cur)L.push(cur);return L;};
    let lines=wrap(rw);
    if(!forced&&(lines.length-1)*pitch+cap>rh) return null;
    let lo=Math.min(mw,rw),hi=rw;
    for(let k=0;k<12;k++){const mid=(lo+hi)/2;if(wrap(mid).length<=lines.length)hi=mid;else lo=mid;}
    lines=wrap(hi);
    return {size,lines,pitch,cap};
  };
  for(let size=Math.max(9,Math.round(size0));size>=9;size--){const r=mk(size,false);if(r) return r;}
  return mk(9,true);
}
function eraseItem(ctx,it){
  const {X0,Y0,w,h,bgL,prot,fill,cap}=it;
  const id=ctx.getImageData(X0,Y0,w,h),px=id.data,N=w*h,T=bgL*0.74,m=new Uint8Array(N);
  for(const q of it.rects)for(let y=q.y0;y<q.y1;y++)for(let x=q.x0;x<q.x1;x++){const i=y*w+x;if(!prot[i]&&lumOf(px,i*4)<T)m[i]=1;}
  const r=Math.max(1,Math.round(cap*0.09)),t=new Uint8Array(N),u=new Uint8Array(N);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(m[y*w+x]){for(let k=Math.max(0,x-r);k<=Math.min(w-1,x+r);k++)t[y*w+k]=1;}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(t[y*w+x]){for(let k=Math.max(0,y-r);k<=Math.min(h-1,y+r);k++)u[k*w+x]=1;}}
  for(let i=0;i<N;i++){if(u[i]&&!prot[i]){const p=i*4;px[p]=fill[0];px[p+1]=fill[1];px[p+2]=fill[2];}}
  ctx.putImageData(id,X0,Y0);
}
function drawItem(ctx,it){
  const text=it.upper?it.uz.toUpperCase():it.uz;
  if(!text.trim()) return;
  const cx=(it.tx0+it.tx1)/2,cy=(it.ty0+it.ty1)/2,cap=it.cap;
  const rw=(it.tx1-it.tx0)*1.12+0.5*cap,rh=(it.ty1-it.ty0)*1.15+(it.nLines===1?2.2:0.9)*cap;
  const L=layoutRect(ctx,text,rw,rh,cap/0.72,it.pitchR);
  const blockH=(L.lines.length-1)*L.pitch+L.cap,top=cy-blockH/2+L.cap;
  ctx.font=FONT(L.size);ctx.fillStyle=it.color;ctx.textBaseline='alphabetic';
  ctx.textAlign=it.align==='left'?'left':'center';
  const x=it.align==='left'?it.tx0:cx;
  L.lines.forEach((l,i)=>ctx.fillText(l,x,top+i*L.pitch));
}
function render(){
  if(!state) return;
  const {ctx,img,items}=state;
  ctx.drawImage(img,0,0);
  const act=items.filter(it=>it.uz.trim());
  act.forEach(it=>eraseItem(ctx,it));
  act.forEach(it=>drawItem(ctx,it));
}
// ---------- Tahrirlash oynasi ----------
function buildCards(){
  itemsBox.innerHTML='';
  state.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<label></label><textarea class="en"></textarea><button class="mini">Qayta tarjima</button><label>Tarjima (tahrirlash mumkin)</label><textarea class="uz"></textarea><div class="alts"></div>';
    const [l1]=d.querySelectorAll('label'),en=d.querySelector('.en'),uz=d.querySelector('.uz'),btn=d.querySelector('.mini'),alts=d.querySelector('.alts');
    l1.textContent=`${i+1}. Asl matn`;
    en.value=it.en;uz.value=it.uz;
    en.oninput=()=>{it.en=en.value;};
    uz.oninput=()=>{it.uz=uz.value;};
    const showAlts=()=>{
      alts.innerHTML='';
      if(!it.alts||it.alts.length<2) return;
      it.alts.forEach(a=>{
        const b=document.createElement('button');b.className='alt';
        const n=document.createElement('b');n.textContent=a.n+': ';
        b.appendChild(n);b.appendChild(document.createTextNode(a.t));
        b.onclick=()=>{it.uz=a.t;uz.value=a.t;};
        alts.appendChild(b);
      });
    };
    showAlts();
    btn.onclick=async()=>{
      btn.disabled=true;btn.textContent='...';
      const tr=await translateAll(it.en,state.from,state.to);
      if(tr){it.uz=tr.best;it.alts=tr.alts;uz.value=it.uz;showAlts();}
      btn.disabled=false;btn.textContent='Qayta tarjima';
    };
    itemsBox.appendChild(d);
  });
}

// ---------- Asosiy jarayon ----------
translateBtn.addEventListener('click',async()=>{
  if(!selectedUrl) return;
  translateBtn.disabled=true;
  resultSection.classList.remove('show');
  itemsBox.innerHTML='';
  const from=sourceLang.value==='eng'?'en':'uz';
  const to=targetLang.value==='eng'?'en':'uz';
  let worker;
  try{
    showStatus('OCR tayyorlanmoqda (birinchi marta uzoq bo‘lishi mumkin)...','loading');
    worker=await Tesseract.createWorker(sourceLang.value,1);
    const wl=sourceLang.value==='eng'?{tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'’\".,!?-:;… "}:{};
    await worker.setParameters(Object.assign({tessedit_pageseg_mode:'6'},wl));

    const img=(preview.complete&&preview.naturalWidth>0)?preview:await loadImg(selectedUrl);
    const W=img.naturalWidth,H=img.naturalHeight;
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0);

    showStatus('Matn qidirilmoqda...','loading');
    await sleep(50);
    const det=findTextBlocks(ctx,W,H);
    const blocks=det.blocks,items=[],skipped=[];let failed=0;

    for(let n=0;n<blocks.length;n++){
      showStatus(`Matn ${n+1}/${blocks.length} o‘qilmoqda...`,'loading');
      const pr=prepBlock(ctx,det,blocks[n]);
      const {w,h,px,bgL,prot}=pr,N=w*h;
      // OCR uchun: chiziq/rasm o'chiriladi, fon tekislanadi
      const cd=new ImageData(w,h),lo=bgL*0.45,hi=bgL*0.75;
      for(let i=0;i<N;i++){const p=i*4;
        const v=prot[i]?255:Math.max(0,Math.min(255,255*(lumOf(px,p)-lo)/(hi-lo)));
        cd.data[p]=cd.data[p+1]=cd.data[p+2]=v;cd.data[p+3]=255;}
      const c1=document.createElement('canvas');c1.width=w;c1.height=h;c1.getContext('2d').putImageData(cd,0,0);
      const sc=Math.max(0.12,Math.min(44/pr.cap,4,3200/w,3200/h));
      const c2=document.createElement('canvas');c2.width=Math.max(1,Math.round(w*sc));c2.height=Math.max(1,Math.round(h*sc));
      const c2x=c2.getContext('2d');c2x.imageSmoothingQuality='high';c2x.drawImage(c1,0,0,c2.width,c2.height);

      let {data}=await worker.recognize(c2);
      if(data.confidence<55){
        await worker.setParameters({tessedit_pageseg_mode:'11'});
        const r2=await worker.recognize(c2);
        await worker.setParameters({tessedit_pageseg_mode:'6'});
        if(r2.data.confidence>data.confidence) data=r2.data;
      }
      const txt=(data.text||'').replace(/[^\p{L}\p{N}'’ʻ".,!?\-:; \n]/gu,' ').replace(/\s+/g,' ').trim();
      const lettersN=txt.replace(/[^\p{L}]/gu,'').length,alnumN=txt.replace(/[^\p{L}\p{N}]/gu,'').length||1;
      if(data.confidence<35||lettersN<2||lettersN/alnumN<0.8||!plausible(txt,data)){
        skipped.push(`@${pr.tx0},${pr.ty0} ${Math.round(data.confidence)}%:${txt.slice(0,14)}`);continue;
      }
      const tr=await translateAll(txt,from,to);
      if(!tr){failed++;continue;}
      const upper=lettersN>0&&txt.replace(/[^\p{Lu}]/gu,'').length/lettersN>=0.7;
      pr.px=null;
      items.push(Object.assign(pr,{en:txt,uz:tr.best,alts:tr.alts,upper}));
      await sleep(120);
    }
    await worker.terminate();

    state={img,ctx,W,H,items,from,to};
    buildCards();
    render();
    resultSection.classList.add('show');
    if(!items.length) showStatus(`Tarjima qilingan matn topilmadi (${blocks.length} ta matn bloki tekshirildi)`+(failed?' | tarjima limiti tugagan bo‘lishi mumkin':'')+(skipped.length?` | ${skipped.slice(0,6).join(' ; ')}`:''),'error');
    else showStatus(`${items.length}/${blocks.length} ta matn tarjima qilindi`+(failed?`, ${failed} tasi tarjimon xatosi sababli qilinmadi`:'')+(skipped.length?` | o‘qilmadi: ${skipped.slice(0,4).join(' ; ')}`:''),'loading');
    resultSection.scrollIntoView({behavior:'smooth'});
  }catch(err){
    console.error(err);
    showStatus('Xatolik: '+err.message,'error');
    if(worker) try{await worker.terminate();}catch(e){}
  }
  translateBtn.disabled=false;
});

$('applyBtn').addEventListener('click',()=>{render();showStatus('Tarjima rasmga qayta joylandi','loading');});
$('downloadBtn').addEventListener('click',()=>{
  canvas.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='tarjima.png';a.click();});
});
sourceLang.addEventListener('change',()=>{targetLang.value=sourceLang.value==='eng'?'uzb':'eng';});
</script>
