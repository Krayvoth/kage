<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kage Translate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Neucha&family=Permanent+Marker&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f7fa;color:#1a1a1a;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto}
header{text-align:center;margin-bottom:24px}
header h1{font-size:28px;color:#1e40af}
header p{color:#64748b;margin-top:6px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:20px}
.row{display:flex;gap:12px;margin-bottom:16px}
.row>div{flex:1}
label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
select,button,textarea{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff}
.upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;background:#f8fafc}
.upload-area p{color:#64748b}
.upload-area small{color:#94a3b8}
#preview{max-width:100%;max-height:250px;border-radius:10px;margin-top:14px;display:none}
.btn{background:#1e40af;color:#fff;border:none;font-weight:600;cursor:pointer;margin-top:10px}
.btn:disabled{background:#94a3b8}
.btn-secondary{background:#64748b}
.status{text-align:center;padding:12px;border-radius:10px;margin-top:14px;font-size:14px;display:none}
.status.loading{background:#eff6ff;color:#1e40af;display:block}
.status.error{background:#fef2f2;color:#b91c1c;display:block}
.result-section{display:none}
.result-section.show{display:block}
#resultCanvas{width:100%;height:auto;border-radius:8px;display:block;background:#eee}
textarea{line-height:1.4;resize:vertical}
.actions{display:flex;gap:10px;margin-top:12px}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}
.item textarea.en{min-height:56px;font-size:13px;color:#475569;background:#f8fafc}
.item textarea.uz{min-height:80px}
.mini{width:auto;padding:8px 12px;font-size:13px;margin:6px 0 10px;background:#e2e8f0;color:#1e293b;border:0;border-radius:8px;cursor:pointer}
footer{text-align:center;margin-top:30px;color:#94a3b8;font-size:13px}
.alt{width:100%;text-align:left;padding:8px 10px;font-size:13px;margin-top:6px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;color:#1e293b;cursor:pointer;line-height:1.4}
input[type=range]{width:100%;padding:0;margin:6px 0 10px;accent-color:#1e40af}
.mini+.mini{margin-left:6px}
.szv{font-size:13px;color:#475569;margin-left:8px}
.fprev{padding:8px 12px;border:1px dashed #cbd5e1;border-radius:10px;margin:4px 0 4px;font-size:21px;text-align:center;background:#fff;line-height:1.3}
.fnote{display:block;color:#64748b;font-size:12px;margin-bottom:12px}
.fsel{width:100%;margin:6px 0;padding:8px;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;background:#fff}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:5;font-size:14px;color:#475569}
#reader .pg{position:relative;margin:0 0 6px;background:#e2e8f0;border-radius:6px;overflow:hidden}
#reader .pg img{width:100%;display:block}
#reader .pg:not(.ready){min-height:170px;display:flex;align-items:center;justify-content:center}
#reader .pg:not(.ready) img{display:none}
#reader .pg.ready .wait{display:none}
#reader .wait{color:#64748b;font-size:13px}
#reader .tag{position:absolute;left:6px;top:6px;background:rgba(15,23,42,.65);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;z-index:2}
#reader .edit{position:absolute;right:6px;top:6px;margin:0;z-index:2}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Kage Translate</h1>
    <p>English ↔ O‘zbek rasm tarjimasi</p>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label>Qaysi tildan</label>
        <select id="sourceLang"><option value="eng">English</option><option value="uzb">O‘zbek</option></select>
      </div>
      <div>
        <label>Qaysi tilga</label>
        <select id="targetLang"><option value="uzb">O‘zbek</option><option value="eng">English</option></select>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <p>Rasm yoki PDF tanlang</p>
      <small>jpg, png, webp, pdf</small>
      <input type="file" id="fileInput" accept="image/*,application/pdf" hidden>
      <img id="preview" alt="Preview">
    </div>

    <div class="row" style="align-items:flex-end;margin-bottom:6px">
      <div><label>Shrift</label><select id="fontSel"></select></div>
      <div><button class="mini" id="fontUp" style="width:100%;margin:0 0 2px">Shriftni yuklash</button><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden></div>
    </div>
    <div class="fprev" id="fontPrev">Oʻzbek gʻoya, shahar, chiroyli!</div>
    <small class="fnote" id="fontNote"></small>
    <label style="margin-top:4px">PDF sifati (saqlanadigan fayl)</label>
    <select id="pdfQ" style="margin-bottom:12px"><option value="0.95">Yuqori sifat (fayl kattaroq)</option><option value="0.85">O‘rtacha (fayl kichikroq)</option></select>
    <button class="btn" id="translateBtn" disabled>Tarjima qilish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="readerCard" style="display:none">
    <div class="rhead"><span id="rInfo"></span><button class="mini" id="stopBtn" style="display:none;margin:0">To‘xtatish</button></div>
    <button class="btn" id="pdfSaveBtn">PDFni saqlash</button>
    <div id="reader" style="margin-top:10px"></div>
  </div>

  <div class="card result-section" id="resultSection">
    <label id="editTitle">Natija</label>
    <canvas id="resultCanvas"></canvas>
    <label id="scaleLbl" style="margin-top:6px">Matn hajmi: 90%</label>
    <input type="range" id="scale" min="50" max="140" value="90">
    <div class="actions">
      <button class="btn" id="applyBtn">Rasmga qayta joylash</button>
      <button class="btn btn-secondary" id="downloadBtn">Rasmni saqlash</button>
    </div>
    <label style="margin-top:18px">Tarjimani tahrirlash</label>
    <div id="items"></div>
  </div>

  <footer>Kage Translate • Faqat tekin • v25</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const uploadArea=$('uploadArea'),fileInput=$('fileInput'),preview=$('preview'),
      translateBtn=$('translateBtn'),statusEl=$('status'),resultSection=$('resultSection'),
      sourceLang=$('sourceLang'),targetLang=$('targetLang'),canvas=$('resultCanvas'),itemsBox=$('items');
let selectedUrl=null,state=null;

uploadArea.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

let pdfDoc=null,pdfName='',pages={},batchStop=false,batchRun=false;
const readerCard=$('readerCard'),readerEl=$('reader'),rInfo=$('rInfo'),stopBtn=$('stopBtn');
const blobOf=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
const JQ=()=>+($('pdfQ')?$('pdfQ').value:0.95);   // PDF sahifalari JPEG sifati
function explainErr(e){
  const m=String(e&&e.message||e);
  if(/Worker|SecurityError|importScripts|blob-request/i.test(m)) return 'Xatolik: bu oynada (Claude ichidagi ko‘rinish) OCR ishlamaydi, brauzer xavfsizlik cheklovi sabab. Saytni o‘z manzilingizda oching: krayvoth.github.io/MangaTranslate';
  return 'Xatolik: '+m;
}
async function useBlob(blob){
  if(selectedUrl) URL.revokeObjectURL(selectedUrl);
  selectedUrl=URL.createObjectURL(blob);
  preview.src=selectedUrl;preview.style.display='block';
  translateBtn.disabled=false;
}
function setMode(){ // tugmalar nomi tarjima qilinayotgan narsaga qarab o'zgaradi
  $('downloadBtn').textContent=pdfDoc?'PDFni saqlash':'Rasmni saqlash';
  translateBtn.textContent=pdfDoc?'Barcha sahifalarni tarjima qilish':'Tarjima qilish';
  readerCard.style.display=pdfDoc?'block':'none';
}
async function handleFile(file){
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(!isPdf&&!file.type.startsWith('image/')) return showStatus('Faqat rasm yoki PDF yuklash mumkin','error');
  if(batchRun) return showStatus('Avval joriy tarjima tugashini kuting yoki “To‘xtatish” ni bosing','error');
  try{
    resultSection.classList.remove('show');state=null;pages={};readerEl.innerHTML='';
    if(isPdf){
      if(!window.pdfjsLib) return showStatus('PDF kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang.','error');
      showStatus('PDF ochilmoqda...','loading');
      pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      pdfName=file.name.replace(/\.pdf$/i,'');
      setMode();buildReader();
      await useBlob(await renderPdfPage(1));
      showStatus(`${pdfDoc.numPages} sahifali PDF tayyor. “Barcha sahifalarni tarjima qilish” ni bosing.`,'loading');
    }else{
      pdfDoc=null;setMode();
      await useBlob(new Blob([await file.arrayBuffer()],{type:file.type}));
      showStatus('','');
    }
  }catch(e){ showStatus('Faylni o‘qib bo‘lmadi: '+e.message,'error'); }
}
// PDF sahifasini rasmga (canvas) aylantirish
// Sahifadagi eng katta rasmning asl o'lchamidan masshtabni topish (sifat yo'qolmasligi uchun)
async function nativeScale(page,v1){
  try{
    const ops=await withTimeout(page.getOperatorList(),8000),O=pdfjsLib.OPS;
    let best=0;
    for(let i=0;i<ops.fnArray.length;i++){
      const f=ops.fnArray[i];
      if(f!==O.paintImageXObject&&f!==O.paintJpegXObject) continue;
      const name=ops.argsArray[i][0];
      const im=await withTimeout(new Promise(res=>{try{page.objs.get(name,res);}catch(e){res(null);}}),1500).catch(()=>null);
      if(im&&im.width>best) best=im.width;
    }
    return best/v1.width;
  }catch(e){return 0;}
}
const _pdfSc={};
async function renderPdfPage(n,type,q){
  const page=await pdfDoc.getPage(n),v1=page.getViewport({scale:1});
  if(!_pdfSc[n]){
    let sc=Math.min(4,Math.max(await nativeScale(page,v1),1400/v1.width,1)); // rasmning asl o'lchamidan kam bo'lmasin
    while(v1.width*sc*v1.height*sc>16e6&&sc>0.3) sc*=0.9;                       // juda katta sahifani cheklash
    _pdfSc[n]=sc;
  }
  const vp=page.getViewport({scale:_pdfSc[n]}),c=document.createElement('canvas');
  c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:cx,viewport:vp}).promise;
  const blob=await blobOf(c,type||'image/png',q);
  blob.pw=c.width;blob.ph=c.height;c.width=c.height=0;
  if(page.cleanup) page.cleanup();
  return blob;
}

// ---------- Reader: sahifalar pastga surilib o'qiladi ----------
const _io=new IntersectionObserver(es=>{
  for(const e of es){
    const d=e.target,img=d.querySelector('img');d._vis=e.isIntersecting;
    if(e.isIntersecting&&d._url){ if(img.getAttribute('src')!==d._url) img.src=d._url; }
    else if(!e.isIntersecting&&img.getAttribute('src')) img.removeAttribute('src'); // xotirani tejash
  }
},{rootMargin:'1500px 0px'});
function buildReader(){
  readerEl.innerHTML='';
  for(let n=1;n<=pdfDoc.numPages;n++){
    const d=document.createElement('div');d.className='pg';d.dataset.n=n;
    d.innerHTML='<span class="tag"></span><button class="mini edit" style="display:none">Tahrirlash</button><img alt="" decoding="async"><div class="wait"></div>';
    d.querySelector('.tag').textContent='Sahifa '+n;
    d.querySelector('.wait').textContent=n+'-sahifa kutilmoqda';
    d.querySelector('.edit').onclick=()=>openEditor(n);
    readerEl.appendChild(d);_io.observe(d);
  }
  updInfo();
}
function readerSet(n){
  const d=readerEl.children[n-1],pg=pages[n];if(!d||!pg) return;
  if(d._url) URL.revokeObjectURL(d._url);
  d._url=URL.createObjectURL(pg.final);
  d.style.aspectRatio=pg.W+' / '+pg.H;
  d.classList.add('ready');d.querySelector('.tag').textContent='Sahifa '+n+' ✓';
  d.querySelector('.edit').style.display='';
  if(d._vis) d.querySelector('img').src=d._url;
  updInfo();
}
function updInfo(){
  if(!pdfDoc) return;
  const N=pdfDoc.numPages,done=Object.keys(pages).length,mid=innerHeight/2;
  let cur=1;
  for(const d of readerEl.children){ if(d.getBoundingClientRect().bottom>mid){cur=+d.dataset.n;break;} }
  rInfo.textContent=`Sahifa ${cur} / ${N} • tarjima: ${done}/${N}`;
}
let _scT=null;
addEventListener('scroll',()=>{clearTimeout(_scT);_scT=setTimeout(updInfo,120);},{passive:true});

function showStatus(msg,type){statusEl.textContent=msg;statusEl.className='status '+(type||'');}
function loadImg(url){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('Rasm ochilmadi. Rasmni qayta tanlang.'));
    img.src=url;
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function decodeEnt(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value;}
const lumOf=(d,p)=>(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;

// ---------- Tarjima ----------
async function translate(text,from,to){
  let t=text.replace(/\s+/g,' ').trim();
  {const lt=t.replace(/[^\p{L}]/gu,''),up=lt.replace(/[^\p{Lu}]/gu,'');
   if(lt.length&&up.length/lt.length>=0.7) t=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}
  t=t.slice(0,450);
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);
    const j=await r.json();
    const g=(j[0]||[]).map(x=>x[0]).join('');
    if(g) return g;
  }catch(e){}
  for(let k=0;k<2;k++){
    try{
      const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`);
      const j=await r.json();
      const res=j.responseData&&j.responseData.translatedText;
      if(res&&!/MYMEMORY WARNING|QUERY LENGTH/i.test(res)) return decodeEnt(res);
    }catch(e){}
    await sleep(600);
  }
  return null;
}
function polish(tr,to){
  tr=tr.replace(/\s+/g,' ').trim();
  if(to==='uz') tr=tr.replace(/([OoGg])['’‘`´]/g,'$1ʻ');
  return tr;
}

// ---------- Bir nechta tarjimon (Google, Bing, MyMemory) ----------
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('vaqt')),ms||9000))]);
function prepEn(text,from){
  let t=text.replace(/\s+/g,' ').trim();
  const lt=t.replace(/[^\p{L}]/gu,''),up=lt.replace(/[^\p{Lu}]/gu,'');
  if(lt.length&&up.length/lt.length>=0.7){
    t=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
    if(from==='en') t=t.replace(/\bi\b/g,'I');
  }
  return t.slice(0,450);
}
async function trGoogle(t,from,to){
  const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);
  const j=await r.json();return (j[0]||[]).map(x=>x[0]).join('');
}
let msTok=null,msExp=0;
async function trBing(t,from,to){
  if(!msTok||Date.now()>msExp){const a=await fetch('https://edge.microsoft.com/translate/auth');msTok=await a.text();msExp=Date.now()+8*60*1000;}
  const r=await fetch(`https://api-edge.cognitive.microsofttranslator.com/translate?from=${from}&to=${to}&api-version=3.0`,
    {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+msTok},body:JSON.stringify([{Text:t}])});
  const j=await r.json();return j[0].translations[0].text;
}
async function trMyMemory(t,from,to){
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`);
  const j=await r.json();const res=j.responseData&&j.responseData.translatedText;
  if(!res||/MYMEMORY WARNING|QUERY LENGTH/i.test(res)) throw new Error('mm');
  return decodeEnt(res);
}
async function trLingva(t,from,to){
  const r=await fetch(`https://lingva.ml/api/v1/${from}/${to}/${encodeURIComponent(t)}`);
  const j=await r.json();return j.translation;
}
const grams=s=>{s=s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ');const g=new Set();for(let i=0;i<s.length-2;i++)g.add(s.slice(i,i+3));return g;};
const dice=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;for(const x of a)if(b.has(x))n++;return 2*n/(a.size+b.size);};
function pickBest(c){ // eng ko'p tarjimonga o'xshash variant (konsensus)
  if(c.length<3) return c[0].t;
  const g=c.map(x=>grams(x.t));let bi=0,bs=-1;
  c.forEach((x,i)=>{let sc=0;c.forEach((y,j)=>{if(i!==j)sc+=dice(g[i],g[j]);});sc=sc/(c.length-1)+(i===0?0.03:0);if(sc>bs){bs=sc;bi=i;}});
  return c[bi].t;
}
async function translateAll(text,from,to){
  const t=prepEn(text,from);
  const src=[['Google',trGoogle],['Bing',trBing],['MyMemory',trMyMemory]];
  const rs=await Promise.all(src.map(([n,f])=>withTimeout(f(t,from,to)).then(x=>({n,t:polish((x||'').trim(),to)})).catch(()=>null)));
  let c=rs.filter(r=>r&&r.t&&r.t.toLowerCase()!==t.toLowerCase());
  if(!c.length){try{const x=await withTimeout(trLingva(t,from,to));if(x)c=[{n:'Lingva',t:polish(x.trim(),to)}];}catch(e){}}
  if(!c.length) return null;
  const m=new Map();
  for(const r of c){const k=r.t.toLowerCase();if(m.has(k))m.get(k).n+=' + '+r.n;else m.set(k,{n:r.n,t:r.t});}
  return {best:pickBest(c),alts:[...m.values()]};
}

// Rasm tikuvi: to'liq kenglikdagi ingichka to'q chiziqni topib, ikki tomondagi qatorlar bilan to'ldirish
function repairSeams(ctx,W,H){
  const id=ctx.getImageData(0,0,W,H),d=id.data,band=new Uint8Array(H);
  for(let y=0;y<H;y++){
    const b=y*W*4;let n=0,dk=0,sr=0,sg=0,sb=0;
    for(let x=0;x<W;x+=2){const p=b+x*4;if((d[p]*299+d[p+1]*587+d[p+2]*114)/1000<90)dk++;sr+=d[p];sg+=d[p+1];sb+=d[p+2];n++;}
    if(dk/n<0.97) continue;
    const mr=sr/n,mg=sg/n,mb=sb/n;let same=0;
    for(let x=0;x<W;x+=2){const p=b+x*4;if(Math.abs(d[p]-mr)+Math.abs(d[p+1]-mg)+Math.abs(d[p+2]-mb)<60)same++;}
    if(same/n>=0.96) band[y]=1;
  }
  const lightShare=y=>{const b=y*W*4;let n=0,lt=0;for(let x=0;x<W;x+=2){const p=b+x*4;if((d[p]*299+d[p+1]*587+d[p+2]*114)/1000>110)lt++;n++;}return lt/n;};
  let fixed=0;
  for(let y=0;y<H;){
    if(!band[y]){y++;continue;}
    let y1=y;while(y1+1<H&&band[y1+1])y1++;
    const t=y1-y+1,a=y-1,z=y1+1,top=a-1,bot=z+1;
    if(t>=2&&t<=14&&top>=0&&bot<H&&lightShare(top)>=0.15&&lightShare(bot)>=0.15){
      const mid=(a+z)/2;
      for(let r=a;r<=z;r++){const s=(r<=mid?top:bot)*W*4;d.set(d.subarray(s,s+W*4),r*W*4);}
      fixed++;
    }
    y=y1+1;
  }
  if(fixed) ctx.putImageData(id,0,0);
  return fixed;
}

function cleanOcr(t){
  const k=t.split(' ').filter(Boolean);
  const bad=(w,lead)=>{const l=w.replace(/[^\p{L}]/gu,'');
    if(l.length===0) return true;
    return l.length===1&&w.length<=2&&!/^[AaIi]$/.test(l)&&(lead||l===l.toLowerCase());};
  while(k.length>1&&bad(k[0],true)) k.shift();
  while(k.length>1&&bad(k[k.length-1],false)) k.pop();
  return k.join(' ');
}

// ---------- 1) Matnni topish: harflar -> qatorlar -> bloklar ----------
function findTextBlocks(ctx,W,H){
  const sD=Math.min(1,1400/W),Wd=Math.max(1,Math.round(W*sD)),Hd=Math.max(1,Math.round(H*sD)),N=Wd*Hd;
  const c=document.createElement('canvas');c.width=Wd;c.height=Hd;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.imageSmoothingQuality='high';
  cx.drawImage(ctx.canvas,0,0,Wd,Hd);
  const d=cx.getImageData(0,0,Wd,Hd).data,g=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4) g[i]=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
  const INK=115,lab=new Int32Array(N),stack=new Int32Array(N),isLetter=new Uint8Array((N>>1)+4),letters=[];
  const maxH=Math.max(24,Math.min(110,Math.round(Wd*0.07)));
  let id=0;
  for(let s=0;s<N;s++){
    if(lab[s]||g[s]>=INK) continue;
    id++;
    let sp=0;stack[sp++]=s;lab[s]=id;
    let x0=Wd,y0=Hd,x1=0,y1=0,area=0;
    while(sp){
      const i=stack[--sp],x=i%Wd,y=(i-x)/Wd;area++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=Hd)continue;
        for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=Wd)continue;
          const j=yy*Wd+xx;if(!lab[j]&&g[j]<INK){lab[j]=id;stack[sp++]=j;}}}
    }
    const w=x1-x0+1,h=y1-y0+1,fr=area/(w*h);
    const sizeOk=h<=maxH&&w<=Math.min(10*h+10,320);
    let ok=area>=8&&h>=5&&sizeOk&&fr>=0.1&&(fr<=0.92||w<=0.4*h)&&h/w<=14;
    if(ok){ // atrofi yorug' bo'lishi kerak (pufakcha, izoh qutisi)
      const smp=[],rx0=Math.max(0,x0-3),ry0=Math.max(0,y0-3),rx1=Math.min(Wd-1,x1+3),ry1=Math.min(Hd-1,y1+3);
      const sx=Math.max(1,Math.floor((rx1-rx0)/6)),sy=Math.max(1,Math.floor((ry1-ry0)/6));
      for(let x=rx0;x<=rx1;x+=sx){smp.push(g[ry0*Wd+x],g[ry1*Wd+x]);}
      for(let y=ry0;y<=ry1;y+=sy){smp.push(g[y*Wd+rx0],g[y*Wd+rx1]);}
      smp.sort((a,b)=>a-b);ok=smp[smp.length>>1]>=150;
    }
    isLetter[id]=ok?1:(sizeOk?2:0); // 1 harf, 2 kichik belgi (o'chiriladi), 0 katta chiziq (himoyalanadi)
    if(ok) letters.push({x0,y0,x1,y1,h});
    else if(sizeOk&&area>=2&&h<=0.8*maxH) letters.push({x0,y0,x1,y1,h,small:true}); // nuqta, vergul: qator uzunligiga qo'shiladi
  }
  const med=a=>{const t=[...a].sort((u,v)=>u-v);return t[t.length>>1];};
  letters.sort((a,b)=>a.x0-b.x0);
  const lines=[];
  for(const c of letters){
    let best=null;
    for(const ln of lines){
      const gap=c.x0-ln.x1,gm=Math.max(1.5*ln.h,0.9*(ln.y1-ln.y0));
      if(c.small){
        if(gap>0.9*ln.h||gap<-0.35*ln.h||c.h>0.7*ln.h||c.y1<ln.y0-0.3*ln.h||c.y0>ln.y1+0.3*ln.h) continue;
        best=ln;break;
      }
      if(gap>gm||gap<-0.35*ln.h) continue;
      if(Math.min(ln.y1,c.y1)-Math.max(ln.y0,c.y0)<0.5*Math.min(ln.h,c.h)) continue;
      if(c.h<0.55*ln.h||c.h>1.8*ln.h) continue;
      best=ln;break;
    }
    if(c.small){ if(best){best.x1=Math.max(best.x1,c.x1);best.x0=Math.min(best.x0,c.x0);} }
    else if(best){best.hs.push(c.h);best.n++;best.x1=Math.max(best.x1,c.x1);best.y0=Math.min(best.y0,c.y0);best.y1=Math.max(best.y1,c.y1);best.h=med(best.hs);}
    else lines.push({hs:[c.h],n:1,x0:c.x0,x1:c.x1,y0:c.y0,y1:c.y1,h:c.h});
  }
  const ls=lines.filter(l=>l.n>=2&&l.x1-l.x0>=1.2*l.h&&l.n/((l.x1-l.x0+1)/l.h)>=0.6).sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
  const blocks=[];
  for(const ln of ls){
    let bk=null;
    for(const b of blocks){
      const last=b.lines[b.lines.length-1],gap=ln.y0-last.y1;
      const ox=Math.min(b.x1,ln.x1)-Math.max(b.x0,ln.x0),mw=Math.min(b.x1-b.x0,ln.x1-ln.x0);
      if(gap>1.0*b.h||gap<-0.4*b.h||ox<0.25*mw) continue;
      const tight=gap<=0.7*b.h&&ox>=0.5*mw; // qatorlar zich va ustma-ust: o'lcham farqiga yumshoq
      const r=ln.h/b.h;
      if(tight?(r<0.5||r>2):(r<0.7||r>1.4)) continue;
      bk=b;break;
    }
    if(bk){bk.lines.push(ln);bk.x0=Math.min(bk.x0,ln.x0);bk.x1=Math.max(bk.x1,ln.x1);bk.y1=Math.max(bk.y1,ln.y1);bk.h=med(bk.lines.map(l=>l.h));bk.n+=ln.n;}
    else blocks.push({lines:[ln],x0:ln.x0,x1:ln.x1,y0:ln.y0,y1:ln.y1,h:ln.h,n:ln.n});
  }
  const out=blocks.filter(b=>b.n>=3&&b.x1-b.x0>=2.5*b.h).sort((a,b)=>a.y0-b.y0||a.x0-b.x0).slice(0,90);
  for(const b of out){ // qator oralig'i va tekislash
    const cy=b.lines.map(l=>(l.y0+l.y1)/2),pitches=[];
    for(let i=1;i<cy.length;i++) pitches.push((cy[i]-cy[i-1])/b.h);
    b.pitchR=Math.min(2.4,Math.max(1.35,pitches.length?med(pitches):1.7));
    const sd=a=>{const m=a.reduce((p,q)=>p+q,0)/a.length;return Math.sqrt(a.reduce((p,q)=>p+(q-m)*(q-m),0)/a.length);};
    b.align=(b.lines.length>1&&sd(b.lines.map(l=>l.x0))<0.6*sd(b.lines.map(l=>(l.x0+l.x1)/2)))?'left':'center';
  }
  return {blocks:out,sD,Wd,Hd,lab,isLetter};
}

// Blok atrofini tayyorlash: fon, matn rangi, himoyalangan piksellar (chiziq, rasm)
function prepBlock(ctx,det,b){
  const {sD,Wd,lab,isLetter}=det,cap=b.h/sD,padX=Math.round(1.8*cap)+2,padY=Math.round(0.45*cap)+2;
  const tx0=Math.floor(b.x0/sD),ty0=Math.floor(b.y0/sD),tx1=Math.ceil((b.x1+1)/sD),ty1=Math.ceil((b.y1+1)/sD);
  const X0=Math.max(0,tx0-padX),Y0=Math.max(0,ty0-padY),X1=Math.min(ctx.canvas.width,tx1+padX),Y1=Math.min(ctx.canvas.height,ty1+padY);
  const w=X1-X0,h=Y1-Y0,N=w*h,px=ctx.getImageData(X0,Y0,w,h).data;
  const ls=[];for(let i=0;i<N;i+=7) ls.push(lumOf(px,i*4));ls.sort((u,v)=>u-v);
  const bgL=ls[Math.floor(ls.length*0.7)];
  const prot=new Uint8Array(N),small=new Uint8Array(N);
  for(let y=0;y<h;y++){const dy=Math.min(det.Hd-1,Math.floor((Y0+y)*sD));
    for(let x=0;x<w;x++){const l=lab[dy*Wd+Math.min(Wd-1,Math.floor((X0+x)*sD))];if(l>0){if(isLetter[l]===0)prot[y*w+x]=1;else if(isLetter[l]===2)small[y*w+x]=1;}}}
  const R=[],G=[],B=[],ink=[];
  for(let i=0;i<N;i++){ if(prot[i]) continue; const p=i*4,l=lumOf(px,p);
    if(l>=bgL*0.85){ if(i%3===0){R.push(px[p]);G.push(px[p+1]);B.push(px[p+2]);} }
    else if(l<bgL*0.5) ink.push([l,p]); }
  const md=a=>a.length?a.sort((u,v)=>u-v)[a.length>>1]:255;
  const fill=[md(R),md(G),md(B)];
  let color='#000';
  if(ink.length>=15){ink.sort((u,v)=>u[0]-v[0]);const k=Math.max(15,Math.floor(ink.length*0.4));let r=0,g=0,bl=0;
    for(let j=0;j<k;j++){const p=ink[j][1];r+=px[p];g+=px[p+1];bl+=px[p+2];}
    color=`rgb(${Math.round(r/k)},${Math.round(g/k)},${Math.round(bl/k)})`;}
  const ep=Math.round(0.22*cap)+1;
  return {X0,Y0,w,h,bgL,prot,small,fill,color,cap,tx0,ty0,tx1,ty1,
    rects:b.lines.map(l=>{const lx0=Math.floor(l.x0/sD)-X0,lx1=Math.ceil((l.x1+1)/sD)-X0,ly0=Math.floor(l.y0/sD)-Y0,ly1=Math.ceil((l.y1+1)/sD)-Y0,exx=Math.round(1.5*cap);
      return {x0:Math.max(0,lx0-ep),y0:Math.max(0,ly0-ep),x1:Math.min(w,lx1+ep),y1:Math.min(h,ly1+ep),ex0:Math.max(0,lx0-exx),ex1:Math.min(w,lx1+exx)};}),
    nLines:b.lines.length,pitchR:b.pitchR,align:b.align,px,
    prof:b.lines.map(l=>({x0:l.x0/sD,x1:(l.x1+1)/sD,y0:l.y0/sD,y1:(l.y1+1)/sD}))};
}

// ---------- OCR natijasi haqiqiy matnga o'xshaydimi ----------
const SHORTW=new Set(['no','oh','ah','uh','ok','hi','go','so','me','we','he','it','is','in','on','to','of','or','up','if','by','my','as','at','be','do','an','am','us','i','a']);
function plausible(txt,data){
  const toks=txt.split(' ').filter(Boolean);
  const good=toks.filter(w=>{
    const l=w.replace(/[^\p{L}]/gu,'');
    return (l.length>=3&&/[aeiouyAEIOUY]/.test(l))||(l.length>=1&&l.length<=2&&SHORTW.has(l.toLowerCase()));
  });
  if(!good.length||good.length/toks.length<0.5) return false;
  const ws=data.words||(data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])));
  if(!ws.length) return data.confidence>=40;
  return ws.filter(w=>w.confidence>=55&&w.text.replace(/[^\p{L}]/gu,'').length>=2).length>=1;
}

// ---------- Matnni asl joyiga, asl ko'rinishida joylash ----------
const FONTS={
  neue:{n:'Comic Neue',css:'"Comic Neue","Comic Sans MS",sans-serif',w:700},
  bangers:{n:'Bangers',css:'"Bangers","Comic Sans MS",sans-serif',w:400},
  marker:{n:'Permanent Marker',css:'"Permanent Marker","Comic Sans MS",cursive',w:400},
  neucha:{n:'Neucha',css:'"Neucha","Comic Sans MS",sans-serif',w:400},
  sys:{n:'Standart (tizim)',css:'"Comic Sans MS","Segoe UI",Roboto,Arial,sans-serif',w:700}
};
let CUR='neue',GFONT='neue',CAPR=0.72;
const FONTCSS=(k,s)=>`${FONTS[k].w} ${s}px ${FONTS[k].css}`;
const FONT=s=>FONTCSS(CUR,s);
function useFont(ctx,k){ // shriftni tanlash va bosh harf balandligini o'lchash
  CUR=FONTS[k]?k:'sys';
  ctx.font=FONT(100);
  const a=ctx.measureText('H').actualBoundingBoxAscent;
  CAPR=(a>40&&a<110)?a/100:0.72;
}
const glyphCache={};
function hasGlyph(ctx,ch,k){ // shriftda belgi bormi? (tizim shrifti bilan kengligini solishtiramiz)
  const key=k+ch;if(key in glyphCache) return glyphCache[key];
  ctx.font=FONTCSS(k,60);const a=ctx.measureText(ch).width;
  ctx.font='400 60px sans-serif';const b=ctx.measureText(ch).width;
  return glyphCache[key]=Math.abs(a-b)>0.5;
}
function fixGlyphs(ctx,t){ // oʻ, gʻ belgisi yo'q shriftda ‘ yoki ' ga almashtiramiz
  if(CUR==='sys') return t;
  if(!hasGlyph(ctx,'ʻ',CUR)) t=t.replace(/ʻ/g,'‘');
  if(!hasGlyph(ctx,'‘',CUR)) t=t.replace(/‘/g,"'");
  return t;
}
async function loadFonts(){
  const sample='Oʻzbek gʻoya shahar chiroyli ‘’ ABC xyz';
  await Promise.all(Object.keys(FONTS).filter(k=>k!=='sys').map(k=>document.fonts.load(FONTCSS(k,24),sample).catch(()=>{})));
  for(const k in glyphCache) delete glyphCache[k];
}
const fontsReady=(typeof document!=='undefined'&&document.fonts&&document.fonts.load)?loadFonts():Promise.resolve();
function layoutRect(ctx,text,rw,rh,size0,pitchR){
  const words=text.split(' ').filter(Boolean);
  const mk=(size,forced)=>{
    ctx.font=FONT(size);
    const cap=size*CAPR,pitch=Math.max(cap*1.3,pitchR*cap);
    let mw=0;for(const wd of words) mw=Math.max(mw,ctx.measureText(wd).width);
    if(mw>rw&&!forced) return null;
    const wrap=W=>{const L=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(!cur||ctx.measureText(t).width<=W)cur=t;else{L.push(cur);cur=wd;}}if(cur)L.push(cur);return L;};
    let lines=wrap(rw);
    if(!forced&&(lines.length-1)*pitch+cap>rh) return null;
    let lo=Math.min(mw,rw),hi=rw;
    for(let k=0;k<12;k++){const mid=(lo+hi)/2;if(wrap(mid).length<=lines.length)hi=mid;else lo=mid;}
    lines=wrap(hi);
    return {size,lines,pitch,cap};
  };
  for(let size=Math.max(9,Math.round(size0));size>=9;size--){const r=mk(size,false);if(r) return r;}
  return mk(9,true);
}
// 7-qoida: har bir matnning o'z shakli (qatorlar kengligi) saqlanadi, o'zbekcha matn shu shaklga moslanadi
function layoutProfile(ctx,text,it){
  const words=text.split(' ').filter(Boolean),P=it.prof,m=P?P.length:0,cap0=it.cap;
  if(!words.length||!m) return null;
  const pts=P.map((l,k)=>({t:m===1?0.5:(k+0.5)/m,w:l.x1-l.x0,c:(l.x0+l.x1)/2,x0:l.x0}));
  const at=(t,key)=>{
    if(m===1||t<=pts[0].t) return pts[0][key];
    if(t>=pts[m-1].t) return pts[m-1][key];
    for(let k=0;k<m-1;k++){if(t<=pts[k+1].t){const u=(t-pts[k].t)/(pts[k+1].t-pts[k].t);return pts[k][key]*(1-u)+pts[k+1][key]*u;}}
    return pts[m-1][key];
  };
  const F=(typeof state!=='undefined'&&state?state.scale:0.9)*(it.k||1);
  const cy=(it.ty0+it.ty1)/2,rh=((it.ty1-it.ty0)*1.15+(m===1?2.2:0.9)*cap0)*Math.max(1,F);
  const wcache=new Map(),K=words.length;
  const lw=(a,b)=>{const k=a*200+b;let v=wcache.get(k);if(v===undefined){v=ctx.measureText(words.slice(a,b).join(' ')).width;wcache.set(k,v);}return v;};
  // n qatorga: har bir qator sig'imi asl qator kengligiga mutanosib; so'zlar shaklga eng yaqin taqsimlanadi
  const tryN=(n,f)=>{
    if(K<n) return null;
    const Wc=[];for(let i=0;i<n;i++) Wc.push(at((i+0.5)/n,'w')*1.1*f*F+0.3*cap0*F);
    const INF=1e18,dp=Array.from({length:n+1},()=>Array(K+1).fill(INF)),pr=Array.from({length:n+1},()=>Array(K+1).fill(-1));
    dp[0][0]=0;
    for(let i=1;i<=n;i++)for(let j=i;j<=K;j++)for(let a=i-1;a<j;a++){
      if(dp[i-1][a]>=INF) continue;
      const w=lw(a,j);if(w>Wc[i-1]) continue;
      const c=dp[i-1][a]+(Wc[i-1]-w)*(Wc[i-1]-w);
      if(c<dp[i][j]){dp[i][j]=c;pr[i][j]=a;}
    }
    if(dp[n][K]>=INF) return null;
    const lines=[];let j=K;
    for(let i=n;i>=1;i--){const a=pr[i][j];lines.unshift(words.slice(a,j).join(' '));j=a;}
    return lines;
  };
  for(let size=Math.max(9,Math.round(cap0/CAPR*F));size>=9;size--){
    ctx.font=FONT(size);wcache.clear();
    const cap=size*CAPR,pitch=Math.max(cap*1.3,it.pitchR*cap),nMax=Math.max(1,Math.floor((rh-cap)/pitch)+1);
    for(let n=1;n<=nMax;n++){
      let best=tryN(n,1);if(!best) continue;
      let lo=0.5,hi=1;
      for(let k=0;k<10;k++){const mid=(lo+hi)/2,r=tryN(n,mid);if(r){best=r;hi=mid;}else lo=mid;}
      const nn=best.length,top=cy-((nn-1)*pitch+cap)/2+cap;
      return {size,lines:best.map((q,i)=>({text:q,x:it.align==='left'?at((i+0.5)/nn,'x0'):at((i+0.5)/nn,'c'),y:top+i*pitch}))};
    }
  }
  return null;
}
function eraseItem(ctx,it){
  const {X0,Y0,w,h,bgL,prot,fill,cap}=it;
  const id=ctx.getImageData(X0,Y0,w,h),px=id.data,N=w*h,T=bgL*0.74,m=new Uint8Array(N);
  for(const q of it.rects)for(let y=q.y0;y<q.y1;y++)for(let x=q.ex0;x<q.ex1;x++){ // qator chetidagi nuqtalar (. , ...) ham o'chiriladi
    const i=y*w+x;if(prot[i]||lumOf(px,i*4)>=T) continue;
    if((x>=q.x0&&x<q.x1)||(it.small&&it.small[i])) m[i]=1;
  }
  const r=Math.max(1,Math.round(cap*0.09)),t=new Uint8Array(N),u=new Uint8Array(N);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(m[y*w+x]){for(let k=Math.max(0,x-r);k<=Math.min(w-1,x+r);k++)t[y*w+k]=1;}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(t[y*w+x]){for(let k=Math.max(0,y-r);k<=Math.min(h-1,y+r);k++)u[k*w+x]=1;}}
  for(let i=0;i<N;i++){if(u[i]&&!prot[i]){const p=i*4;px[p]=fill[0];px[p+1]=fill[1];px[p+2]=fill[2];}}
  ctx.putImageData(id,X0,Y0);
}
function drawItem(ctx,it){
  useFont(ctx,(it.font&&FONTS[it.font])?it.font:GFONT);
  let text=it.upper?it.uz.toUpperCase():it.uz;
  text=fixGlyphs(ctx,text);
  if(!text.trim()) return;
  const LP=layoutProfile(ctx,text,it);
  if(LP){
    ctx.font=FONT(LP.size);ctx.fillStyle=it.color;ctx.textBaseline='alphabetic';
    ctx.textAlign=it.align==='left'?'left':'center';
    LP.lines.forEach(l=>ctx.fillText(l.text,l.x,l.y));
    return;
  }
  const cx=(it.tx0+it.tx1)/2,cy=(it.ty0+it.ty1)/2,cap=it.cap;
  const f=(state?state.scale:0.9)*(it.k||1); // matn hajmi (umumiy va har bir matn uchun)
  const rw=((it.tx1-it.tx0)*1.12+0.5*cap)*f,rh=((it.ty1-it.ty0)*1.15+(it.nLines===1?2.2:0.9)*cap)*f;
  const L=layoutRect(ctx,text,rw,rh,cap/CAPR*f,it.pitchR);
  const blockH=(L.lines.length-1)*L.pitch+L.cap,top=cy-blockH/2+L.cap;
  ctx.font=FONT(L.size);ctx.fillStyle=it.color;ctx.textBaseline='alphabetic';
  ctx.textAlign=it.align==='left'?'left':'center';
  const x=it.align==='left'?it.tx0:cx;
  L.lines.forEach((l,i)=>ctx.fillText(l,x,top+i*L.pitch));
}
function render(){
  if(!state) return;
  const {ctx,img,items}=state;
  ctx.drawImage(img,0,0);
  const act=items.filter(it=>it.uz.trim());
  act.forEach(it=>eraseItem(ctx,it));
  act.forEach(it=>drawItem(ctx,it));
  if(state&&state.pageNo) schedCommit();
}

// ---------- Tahrirlash oynasi ----------
function buildCards(){
  itemsBox.innerHTML='';
  state.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<label></label><textarea class="en"></textarea><button class="mini">Qayta tarjima</button><button class="mini sm">A−</button><button class="mini sp">A+</button><span class="szv"></span><select class="fsel"></select><label>Tarjima (tahrirlash mumkin)</label><textarea class="uz"></textarea><div class="alts"></div>';
    const [l1]=d.querySelectorAll('label'),en=d.querySelector('.en'),uz=d.querySelector('.uz'),btn=d.querySelector('.mini'),alts=d.querySelector('.alts');
    l1.textContent=`${i+1}. Asl matn`;
    en.value=it.en;uz.value=it.uz;
    en.oninput=()=>{it.en=en.value;};
    uz.oninput=()=>{it.uz=uz.value;};
    const showAlts=()=>{
      alts.innerHTML='';
      if(!it.alts||it.alts.length<2) return;
      it.alts.forEach(a=>{
        const b=document.createElement('button');b.className='alt';
        const n=document.createElement('b');n.textContent=a.n+': ';
        b.appendChild(n);b.appendChild(document.createTextNode(a.t));
        b.onclick=()=>{it.uz=a.t;uz.value=a.t;};
        alts.appendChild(b);
      });
    };
    showAlts();
    const fs=d.querySelector('.fsel');
    fontOpts(fs,true);fs.value=it.font||'';
    fs.onchange=()=>{it.font=fs.value||undefined;render();};
    const szv=d.querySelector('.szv');
    const upd=()=>{szv.textContent='Hajm: '+Math.round(state.scale*(it.k||1)*100)+'%';};
    upd();(state.upd=state.upd||[]).push(upd);
    d.querySelector('.sm').onclick=()=>{it.k=Math.max(0.4,(it.k||1)*0.92);upd();render();};
    d.querySelector('.sp').onclick=()=>{it.k=Math.min(2,(it.k||1)*1.08);upd();render();};
    btn.onclick=async()=>{
      btn.disabled=true;btn.textContent='...';
      const tr=await translateAll(it.en,state.from,state.to);
      if(tr){it.uz=tr.best;it.alts=tr.alts;uz.value=it.uz;showAlts();}
      btn.disabled=false;btn.textContent='Qayta tarjima';
    };
    itemsBox.appendChild(d);
  });
}

// ---------- Tarjima jarayoni ----------
const ocrWL=()=>sourceLang.value==='eng'?{tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'’\".,!?-:;… "}:{};
let _worker=null,_wLang='';
async function killWorker(){if(_worker){try{await _worker.terminate();}catch(e){}_worker=null;}}
async function getWorker(){
  if(_worker&&_wLang===sourceLang.value) return _worker;
  await killWorker();
  const w=await Tesseract.createWorker(sourceLang.value,1);
  await w.setParameters(Object.assign({tessedit_pageseg_mode:'6'},ocrWL()));
  _worker=w;_wLang=sourceLang.value;return w;
}
// Bitta rasmni tarjima qiladi: matn topish -> o'qish -> tarjima. cv: ishchi canvas
async function processImage(url,worker,from,to,cv,say){
  const img=await loadImg(url);
  const W=img.naturalWidth,H=img.naturalHeight;
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0);
  const fixedSeams=repairSeams(ctx,W,H); // skrinshot tikuvi (butun kenglikdagi ingichka qora chiziq)
  const bc=document.createElement('canvas');bc.width=W;bc.height=H;bc.getContext('2d').drawImage(cv,0,0);
  say('matn qidirilmoqda...');
  await sleep(30);
  const det=findTextBlocks(ctx,W,H);
  const blocks=det.blocks,items=[],skipped=[];let failed=0;
  for(let n=0;n<blocks.length;n++){
    if(batchStop&&pdfDoc){bc.width=bc.height=0;return null;}
    say(`matn ${n+1}/${blocks.length} o‘qilmoqda...`);
    const pr=prepBlock(ctx,det,blocks[n]);
    const {w,h,px,bgL,prot}=pr,N=w*h;
    // OCR uchun: chiziq/rasm o'chiriladi, fon tekislanadi
    const cd=new ImageData(w,h),lo=bgL*0.45,hi=bgL*0.75;
    for(let i=0;i<N;i++){const p=i*4;
      const v=prot[i]?255:Math.max(0,Math.min(255,255*(lumOf(px,p)-lo)/(hi-lo)));
      cd.data[p]=cd.data[p+1]=cd.data[p+2]=v;cd.data[p+3]=255;}
    const c1=document.createElement('canvas');c1.width=w;c1.height=h;c1.getContext('2d').putImageData(cd,0,0);
    const sc=Math.max(0.12,Math.min(44/pr.cap,4,3200/w,3200/h));
    const c2=document.createElement('canvas');c2.width=Math.max(1,Math.round(w*sc));c2.height=Math.max(1,Math.round(h*sc));
    const c2x=c2.getContext('2d');c2x.imageSmoothingQuality='high';c2x.drawImage(c1,0,0,c2.width,c2.height);
    let {data}=await worker.recognize(c2);
    if(data.confidence<55){
      await worker.setParameters({tessedit_pageseg_mode:'11'});
      const r2=await worker.recognize(c2);
      await worker.setParameters({tessedit_pageseg_mode:'6'});
      if(r2.data.confidence>data.confidence) data=r2.data;
    }
    c1.width=c1.height=c2.width=c2.height=0;
    const txt=cleanOcr((data.text||'').replace(/[^\p{L}\p{N}'’ʻ".,!?\-:; \n]/gu,' ').replace(/\s+/g,' ').trim());
    const lettersN=txt.replace(/[^\p{L}]/gu,'').length,alnumN=txt.replace(/[^\p{L}\p{N}]/gu,'').length||1;
    if(data.confidence<35||lettersN<2||lettersN/alnumN<0.8||!plausible(txt,data)){
      skipped.push(`@${pr.tx0},${pr.ty0} ${Math.round(data.confidence)}%:${txt.slice(0,14)}`);continue;
    }
    const tr=await translateAll(txt,from,to);
    if(!tr){failed++;continue;}
    const upper=lettersN>0&&txt.replace(/[^\p{Lu}]/gu,'').length/lettersN>=0.7;
    pr.px=null;
    items.push(Object.assign(pr,{en:txt,uz:tr.best,alts:tr.alts,upper,k:1}));
    await sleep(120);
  }
  return {img:bc,ctx,W,H,items,from,to,scale:+$('scale').value/100,upd:[],fixedSeams,nBlocks:blocks.length,skipped,failed};
}
const summary=st=>!st.items.length
  ?`Tarjima qilingan matn topilmadi (${st.nBlocks} ta matn bloki tekshirildi)`+(st.failed?' | tarjima limiti tugagan bo‘lishi mumkin':'')+(st.skipped.length?` | ${st.skipped.slice(0,6).join(' ; ')}`:'')
  :`${st.items.length}/${st.nBlocks} ta matn tarjima qilindi`+(st.fixedSeams?` (${st.fixedSeams} ta tikuv chizig‘i tuzatildi)`:'')+(st.failed?`, ${st.failed} tasi tarjimon xatosi sababli qilinmadi`:'')+(st.skipped.length?` | o‘qilmadi: ${st.skipped.slice(0,4).join(' ; ')}`:'');

// Bitta rasm
translateBtn.addEventListener('click',async()=>{
  if(!selectedUrl) return;
  if(pdfDoc) return translatePdf();
  translateBtn.disabled=true;
  resultSection.classList.remove('show');itemsBox.innerHTML='';$('editTitle').textContent='Natija';
  const from=sourceLang.value==='eng'?'en':'uz',to=targetLang.value==='eng'?'en':'uz';
  try{
    showStatus('OCR tayyorlanmoqda (birinchi marta uzoq bo‘lishi mumkin)...','loading');
    const worker=await getWorker();
    const st=await processImage(selectedUrl,worker,from,to,canvas,m=>showStatus(m,'loading'));
    state=st;buildCards();await fontsReady;render();
    resultSection.classList.add('show');
    showStatus(summary(st),st.items.length?'loading':'error');
    resultSection.scrollIntoView({behavior:'smooth'});
  }catch(err){console.error(err);showStatus(explainErr(err),'error');}
  await killWorker();
  translateBtn.disabled=false;
});

// PDF: barcha sahifalar ketma-ket avtomatik tarjima qilinadi
async function storePage(n,st,cv){
  const keep=state;state=st;render();state=keep;   // st.ctx = cv
  const final=await blobOf(cv,'image/jpeg',JQ());
  st.img.width=st.img.height=0;
  pages[n]={final,W:st.W,H:st.H,items:st.items,from:st.from,to:st.to,info:summary(st)};
  readerSet(n);
}
// Telefon ekrani o'chib qolmasin (uzoq jarayon uchun)
let _wl=null;
async function keepAwake(on){
  try{
    if(on&&navigator.wakeLock&&!_wl){_wl=await navigator.wakeLock.request('screen');_wl.addEventListener('release',()=>{_wl=null;});}
    else if(!on&&_wl){await _wl.release();_wl=null;}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(batchRun&&document.visibilityState==='visible')keepAwake(true);});
async function translatePdf(){
  if(batchRun) return;
  batchRun=true;batchStop=false;translateBtn.disabled=true;stopBtn.style.display='';keepAwake(true);
  let fatal=null;const N=pdfDoc.numPages,from=sourceLang.value==='eng'?'en':'uz',to=targetLang.value==='eng'?'en':'uz',bad=[];
  try{
    showStatus('OCR tayyorlanmoqda (birinchi marta uzoq bo‘lishi mumkin)...','loading');
    const worker=await getWorker();
    await fontsReady;
    for(let n=1;n<=N&&!batchStop;n++){
      if(pages[n]) continue;                       // oldin tarjima qilingan sahifa
      const say=m=>showStatus(`Sahifa ${n}/${N}: ${m}`,'loading');
      const cv=document.createElement('canvas');let url=null;
      try{
        say('tayyorlanmoqda...');
        url=URL.createObjectURL(await renderPdfPage(n));
        const st=await processImage(url,worker,from,to,cv,say);
        if(!st) break;                             // "To'xtatish" bosildi
        await storePage(n,st,cv);
      }catch(e){console.error(e);bad.push(n);}
      finally{if(url)URL.revokeObjectURL(url);cv.width=cv.height=0;}
      await sleep(30);
    }
  }catch(e){console.error(e);fatal=e;}
  await killWorker();
  const done=Object.keys(pages).length;
  const stopped=batchStop;
  batchRun=false;batchStop=false;translateBtn.disabled=false;stopBtn.style.display='none';keepAwake(false);
  if(fatal){showStatus(explainErr(fatal),'error');updInfo();return;}
  showStatus(stopped?`To‘xtatildi: ${done}/${N} sahifa tarjima qilingan. Davom ettirish uchun tugmani qayta bosing.`
    :`Tayyor: ${done}/${N} sahifa tarjima qilindi.`+(bad.length?` Xato bo‘lgan sahifalar: ${bad.join(', ')} (tugmani qayta bossangiz qayta uriniladi).`:' “PDFni saqlash” ni bosing.'),
    (stopped||bad.length)?'error':'loading');
  updInfo();
}
stopBtn.onclick=()=>{batchStop=true;showStatus('To‘xtatilmoqda (joriy sahifa tugashi kutiladi)...','loading');};

// Reader'dagi sahifani tahrirlash
let _edUrl=null;
async function openEditor(n){
  const pg=pages[n];if(!pg) return;
  try{
    showStatus(`${n}-sahifa ochilmoqda...`,'loading');
    if(_edUrl) URL.revokeObjectURL(_edUrl);
    _edUrl=URL.createObjectURL(await renderPdfPage(n));   // asl sahifa qayta chiziladi (sifat yo'qolmasligi uchun)
    const im=await loadImg(_edUrl);
    const img=document.createElement('canvas');img.width=pg.W;img.height=pg.H;
    const ix=img.getContext('2d',{willReadFrequently:true});ix.drawImage(im,0,0,pg.W,pg.H);repairSeams(ix,pg.W,pg.H);
    canvas.width=pg.W;canvas.height=pg.H;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    state={img,ctx,W:pg.W,H:pg.H,items:pg.items,from:pg.from,to:pg.to,scale:+$('scale').value/100,upd:[],pageNo:n};
    $('editTitle').textContent=`${n}-sahifani tahrirlash`;
    buildCards();await fontsReady;render();
    resultSection.classList.add('show');resultSection.scrollIntoView({behavior:'smooth'});
  }catch(e){showStatus('Sahifani ochib bo‘lmadi: '+e.message,'error');}
}
let _cmT=null;
function schedCommit(){ // tahrirdan keyin sahifa rasmi va reader yangilanadi
  clearTimeout(_cmT);
  _cmT=setTimeout(async()=>{
    if(!state||!state.pageNo||!pages[state.pageNo]) return;
    const n=state.pageNo;
    pages[n].final=await blobOf(canvas,'image/jpeg',JQ());
    readerSet(n);
  },700);
}

// ---------- PDF yig'ish (kutubxonasiz, JPEG sahifalardan) ----------
function buildPdf(parts,title){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const add=x=>{chunks.push(x);len+=(x.size!==undefined?x.size:x.length);};
  const str=t=>enc.encode(t);
  add(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const N=parts.length,nObj=3+3*N;
  const obj=(id,body)=>{offs[id]=len;add(str(`${id} 0 obj\n${body}\nendobj\n`));};
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,`<</Type/Pages/Count ${N}/Kids[${parts.map((p,i)=>(3+3*i)+' 0 R').join(' ')}]>>`);
  parts.forEach((p,i)=>{
    const pg=3+3*i,ct=4+3*i,im=5+3*i;
    const s=Math.min(1,14000/Math.max(p.w,p.h))*0.5,pw=(p.w*s).toFixed(2),ph=(p.h*s).toFixed(2);
    obj(pg,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${ct} 0 R>>`);
    const c=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(ct,`<</Length ${c.length}>>\nstream\n${c}\nendstream`);
    offs[im]=len;
    add(str(`${im} 0 obj\n<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.blob.size}>>\nstream\n`));
    add(p.blob);add(str('\nendstream\nendobj\n'));
  });
  const hex=Array.from(String(title||'Kage Translate')).map(ch=>ch.charCodeAt(0).toString(16).padStart(4,'0')).join('');
  obj(nObj,`<</Title<FEFF${hex}>/Producer<FEFF004B0061006700650020005400720061006E0073006C006100740065>>>`);
  const xr=len;
  let x=`xref\n0 ${nObj+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=nObj;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  x+=`trailer\n<</Size ${nObj+1}/Root 1 0 R/Info ${nObj} 0 R>>\nstartxref\n${xr}\n%%EOF\n`;
  add(str(x));
  return new Blob(chunks,{type:'application/pdf'});
}
async function savePdf(){
  if(!pdfDoc) return;
  if(batchRun) return showStatus('Tarjima tugagach saqlang yoki avval “To‘xtatish” ni bosing','error');
  const N=pdfDoc.numPages,parts=[];let orig=0;
  try{
    for(let n=1;n<=N;n++){
      showStatus(`PDF yig‘ilmoqda: ${n}/${N}`,'loading');
      const pg=pages[n];
      if(pg) parts.push({blob:pg.final,w:pg.W,h:pg.H});
      else{const b=await renderPdfPage(n,'image/jpeg',JQ());parts.push({blob:b,w:b.pw,h:b.ph});orig++;}
      await sleep(0);
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(buildPdf(parts,pdfName+' (tarjima)'));a.download=`${pdfName}_uz.pdf`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    showStatus(`PDF saqlandi: ${N} sahifa`+(orig?` (${orig} sahifa hali tarjima qilinmagan, asl holida)`:''),'loading');
  }catch(e){console.error(e);showStatus('PDF yig‘ib bo‘lmadi: '+e.message,'error');}
}
$('pdfSaveBtn').onclick=savePdf;

let _szT=null;
$('scale').addEventListener('input',()=>{
  const v=+$('scale').value;$('scaleLbl').textContent='Matn hajmi: '+v+'%';
  if(!state) return;
  state.scale=v/100;(state.upd||[]).forEach(f=>f());
  clearTimeout(_szT);_szT=setTimeout(render,120);
});
// ---------- Shrift tanlash ----------
function fontOpts(sel,withDefault){
  sel.innerHTML='';
  if(withDefault){const o=document.createElement('option');o.value='';o.textContent='Umumiy shrift';sel.appendChild(o);}
  for(const k in FONTS){const o=document.createElement('option');o.value=k;o.textContent=FONTS[k].n;sel.appendChild(o);}
}
const fontSel=$('fontSel'),fontPrev=$('fontPrev'),fontNote=$('fontNote');
function updPrev(){
  const f=FONTS[GFONT];fontPrev.style.fontFamily=f.css;fontPrev.style.fontWeight=f.w;
  const c=document.createElement('canvas').getContext('2d');
  const ok=GFONT==='sys'||hasGlyph(c,'ʻ',GFONT);
  fontNote.textContent=ok?'Bu shriftda oʻ va gʻ belgilari bor.':'Bu shriftda oʻ/gʻ belgisi yo‘q: ‘ belgisi bilan almashtiriladi.';
}
fontOpts(fontSel,false);fontSel.value=GFONT;
fontsReady.then(updPrev);updPrev();
fontSel.onchange=async()=>{GFONT=fontSel.value;await fontsReady;updPrev();if(state)render();};
$('fontUp').onclick=()=>$('fontFile').click();
$('fontFile').onchange=async e=>{
  const f=e.target.files[0];if(!f) return;
  try{
    const name='KageFont'+(Date.now()%1000000);
    const ff=new FontFace(name,await f.arrayBuffer());await ff.load();document.fonts.add(ff);
    const key='c'+name;
    FONTS[key]={n:f.name.replace(/\.[^.]+$/,''),css:`"${name}","Comic Sans MS",sans-serif`,w:400};
    fontOpts(fontSel,false);GFONT=key;fontSel.value=key;updPrev();
    if(state){buildCards();render();}
  }catch(err){showStatus('Shriftni yuklab bo‘lmadi: '+err.message,'error');}
  e.target.value='';
};

$('applyBtn').addEventListener('click',()=>{render();showStatus('Tarjima rasmga qayta joylandi','loading');});
$('downloadBtn').addEventListener('click',()=>{
  if(pdfDoc) return savePdf();
  canvas.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='tarjima.png';a.click();});
});
sourceLang.addEventListener('change',()=>{targetLang.value=sourceLang.value==='eng'?'uzb':'eng';});
</script>
