<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kage Translate</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f5f7fa;color:#1a1a1a;min-height:100vh;padding:20px}
.container{max-width:600px;margin:0 auto}
header{text-align:center;margin-bottom:24px}
header h1{font-size:28px;color:#1e40af}
header p{color:#64748b;margin-top:6px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:20px}
.row{display:flex;gap:12px;margin-bottom:16px}
.row>div{flex:1}
label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
select,button,textarea{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff}
.upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;background:#f8fafc}
.upload-area p{color:#64748b}
.upload-area small{color:#94a3b8}
#preview{max-width:100%;max-height:250px;border-radius:10px;margin-top:14px;display:none}
.btn{background:#1e40af;color:#fff;border:none;font-weight:600;cursor:pointer;margin-top:10px}
.btn:disabled{background:#94a3b8}
.btn-secondary{background:#64748b}
.status{text-align:center;padding:12px;border-radius:10px;margin-top:14px;font-size:14px;display:none}
.status.loading{background:#eff6ff;color:#1e40af;display:block}
.status.error{background:#fef2f2;color:#b91c1c;display:block}
.result-section{display:none}
.result-section.show{display:block}
#resultCanvas{width:100%;height:auto;border-radius:8px;display:block;background:#eee}
textarea{line-height:1.4;resize:vertical}
.actions{display:flex;gap:10px;margin-top:12px}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}
.item textarea.en{min-height:56px;font-size:13px;color:#475569;background:#f8fafc}
.item textarea.uz{min-height:80px}
.mini{width:auto;padding:8px 12px;font-size:13px;margin:6px 0 10px;background:#e2e8f0;color:#1e293b;border:0;border-radius:8px;cursor:pointer}
footer{text-align:center;margin-top:30px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Kage Translate</h1>
    <p>English ↔ O‘zbek rasm tarjimasi</p>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label>Qaysi tildan</label>
        <select id="sourceLang"><option value="eng">English</option><option value="uzb">O‘zbek</option></select>
      </div>
      <div>
        <label>Qaysi tilga</label>
        <select id="targetLang"><option value="uzb">O‘zbek</option><option value="eng">English</option></select>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <p>Rasmni bosib tanlang</p>
      <small>jpg, png, webp</small>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <img id="preview" alt="Preview">
    </div>

    <button class="btn" id="translateBtn" disabled>Tarjima qilish</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card result-section" id="resultSection">
    <label>Natija</label>
    <canvas id="resultCanvas"></canvas>
    <div class="actions">
      <button class="btn" id="applyBtn">Rasmga qayta joylash</button>
      <button class="btn btn-secondary" id="downloadBtn">Rasmni saqlash</button>
    </div>
    <label style="margin-top:18px">Tarjimani tahrirlash</label>
    <div id="items"></div>
  </div>

  <footer>Kage Translate • Faqat tekin • v16</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const uploadArea=$('uploadArea'),fileInput=$('fileInput'),preview=$('preview'),
      translateBtn=$('translateBtn'),statusEl=$('status'),resultSection=$('resultSection'),
      sourceLang=$('sourceLang'),targetLang=$('targetLang'),canvas=$('resultCanvas'),itemsBox=$('items');
let selectedUrl=null,state=null;

uploadArea.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

async function handleFile(file){
  if(!file.type.startsWith('image/')) return showStatus('Faqat rasm yuklash mumkin','error');
  try{
    const buf=await file.arrayBuffer();
    const blob=new Blob([buf],{type:file.type});
    if(selectedUrl) URL.revokeObjectURL(selectedUrl);
    selectedUrl=URL.createObjectURL(blob);
    preview.src=selectedUrl;
    preview.style.display='block';
    translateBtn.disabled=false;
    resultSection.classList.remove('show');
    showStatus('','');
  }catch(e){ showStatus('Faylni o‘qib bo‘lmadi. Rasmni qayta tanlang.','error'); }
}
function showStatus(msg,type){statusEl.textContent=msg;statusEl.className='status '+(type||'');}
function loadImg(url){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error('Rasm ochilmadi. Rasmni qayta tanlang.'));
    img.src=url;
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function decodeEnt(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value;}
const lumOf=(d,p)=>(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;

// ---------- Tarjima ----------
async function translate(text,from,to){
  let t=text.replace(/\s+/g,' ').trim();
  {const lt=t.replace(/[^\p{L}]/gu,''),up=lt.replace(/[^\p{Lu}]/gu,'');
   if(lt.length&&up.length/lt.length>=0.7) t=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());}
  t=t.slice(0,450);
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);
    const j=await r.json();
    const g=(j[0]||[]).map(x=>x[0]).join('');
    if(g) return g;
  }catch(e){}
  for(let k=0;k<2;k++){
    try{
      const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${from}|${to}`);
      const j=await r.json();
      const res=j.responseData&&j.responseData.translatedText;
      if(res&&!/MYMEMORY WARNING|QUERY LENGTH/i.test(res)) return decodeEnt(res);
    }catch(e){}
    await sleep(600);
  }
  return null;
}
function polish(tr,to){
  tr=tr.replace(/\s+/g,' ').trim();
  if(to==='uz') tr=tr.replace(/([OoGg])['’‘`´]/g,'$1ʻ');
  return tr;
}

// ---------- 1) Bir xil rangli yopiq joylarni topish ----------
function findBubbles(ctx,W,H){
  const d=ctx.getImageData(0,0,W,H).data,N=W*H;
  const g=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4) g[i]=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000;
  const lab=new Int32Array(N),stack=new Int32Array(N),res=[];
  const near=(i,j)=>{
    if(g[j]<110||lab[j]) return false;
    const p=i*4,q=j*4;
    return Math.abs(d[p]-d[q])+Math.abs(d[p+1]-d[q+1])+Math.abs(d[p+2]-d[q+2])<=24;
  };
  let id=0;
  for(let s=0;s<N;s++){
    if(lab[s]||g[s]<110) continue;
    id++;
    let sp=0;stack[sp++]=s;lab[s]=id;
    let x0=W,y0=H,x1=0,y1=0,area=0;
    while(sp){
      const i=stack[--sp],x=i%W,y=(i-x)/W;area++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&near(i,i-1)){lab[i-1]=id;stack[sp++]=i-1;}
      if(x<W-1&&near(i,i+1)){lab[i+1]=id;stack[sp++]=i+1;}
      if(y>0&&near(i,i-W)){lab[i-W]=id;stack[sp++]=i-W;}
      if(y<H-1&&near(i,i+W)){lab[i+W]=id;stack[sp++]=i+W;}
    }
    const bw=x1-x0+1,bh=y1-y0+1;
    if(area<2500||bw<50||bh<35) continue;
    if(bw>W*0.98&&bh>H*0.5) continue;
    if(area/(bw*bh)<0.4||area>0.5*W*H) continue;
    res.push({id,s,x0,y0,bw,bh});
  }
  return {res,lab};
}
function interiorMask(lab,W,b){
  const {x0,y0,bw,bh,id}=b,N=bw*bh;
  const comp=new Uint8Array(N),out=new Uint8Array(N),st=new Int32Array(N);
  for(let y=0;y<bh;y++){const row=(y0+y)*W+x0;for(let x=0;x<bw;x++) if(lab[row+x]===id) comp[y*bw+x]=1;}
  let sp=0;
  const push=j=>{if(!comp[j]&&!out[j]){out[j]=1;st[sp++]=j;}};
  for(let x=0;x<bw;x++){push(x);push((bh-1)*bw+x);}
  for(let y=0;y<bh;y++){push(y*bw);push(y*bw+bw-1);}
  while(sp){
    const i=st[--sp],x=i%bw,y=(i-x)/bw;
    if(x>0)push(i-1);if(x<bw-1)push(i+1);if(y>0)push(i-bw);if(y<bh-1)push(i+bw);
  }
  return {comp,out};
}
// ---------- OCR natijasi haqiqiy matnga o'xshaydimi ----------
const SHORTW=new Set(['no','oh','ah','uh','ok','hi','go','so','me','we','he','it','is','in','on','to','of','or','up','if','by','my','as','at','be','do','an','am','us','i','a']);
function plausible(txt,data){
  const toks=txt.split(' ').filter(Boolean);
  const good=toks.filter(w=>{
    const l=w.replace(/[^\p{L}]/gu,'');
    return (l.length>=3&&/[aeiouyAEIOUY]/.test(l))||(l.length>=1&&l.length<=2&&SHORTW.has(l.toLowerCase()));
  });
  if(!good.length||good.length/toks.length<0.5) return false;
  const ws=data.words||(data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])));
  if(!ws.length) return data.confidence>=40;
  return ws.filter(w=>w.confidence>=55&&w.text.replace(/[^\p{L}]/gu,'').length>=2).length>=1;
}

// ---------- Matnni pufakcha shakliga, asl joyiga joylash ----------
const FONT=s=>`bold ${s}px "Comic Sans MS","Segoe UI",Roboto,Arial,sans-serif`;
function layoutItem(ctx,it,text){
  const {bw,bh,sp,tb}=it,mg=Math.max(4,Math.round(bw*0.025));
  const words=text.split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  // markaz (tb.cx) atrofida simmetrik yarim kenglik
  const half=(y,h)=>{
    if(y<0||y+h>bh) return 0;
    let hw=1e9;
    for(let k=Math.floor(y);k<Math.ceil(y+h);k++){
      if(sp.L[k]<0) return 0;
      hw=Math.min(hw,tb.cx-(sp.L[k]+mg),(sp.R[k]-mg)-tb.cx);
    }
    return hw>6?hw:0;
  };
  const greedy=(top,lh)=>{
    const lines=[];let wi=0,y=top;
    while(wi<words.length){
      const hw=half(y,lh);if(!hw) return null;
      const w=2*hw;let cur='';
      while(wi<words.length){
        const t=cur?cur+' '+words[wi]:words[wi];
        if(ctx.measureText(t).width<=w){cur=t;wi++;}else break;
      }
      if(!cur) return null;
      lines.push(cur);y+=lh;
    }
    return lines;
  };
  const uniform=w=>{
    const lines=[];let cur='';
    for(const wd of words){
      const t=cur?cur+' '+wd:wd;
      if(ctx.measureText(t).width<=w||!cur) {cur=t;} else {lines.push(cur);cur=wd;}
    }
    lines.push(cur);return lines;
  };
  for(let size=Math.max(9,Math.floor(it.size0));size>=9;size--){
    ctx.font=FONT(size);
    const lh=size*1.15;
    const total=ctx.measureText(words.join(' ')).width;
    let w0=2*half(tb.cy-lh/2,lh);if(!w0) w0=tb.w*1.2;
    let top=tb.cy-Math.max(1,Math.ceil(total/(w0*0.9)))*lh/2,best=null;
    for(let k=0;k<5;k++){
      const l=greedy(top,lh);if(!l) break;
      best={lines:l,top};
      const nt=tb.cy-l.length*lh/2;
      if(Math.abs(nt-top)<2){best.top=nt;break;}
      top=nt;
    }
    if(!best) continue;
    // qatorlarni tekis (muvozanatli) taqsimlash
    let n=best.lines.length;
    if(n>=2){
      let lo=Math.max(...words.map(w=>ctx.measureText(w).width)),hi=Math.max(...best.lines.map(l=>ctx.measureText(l).width));
      for(let k=0;k<14&&hi-lo>1;k++){const mid=(lo+hi)/2;if(uniform(mid).length<=n)hi=mid;else lo=mid;}
      const l2=uniform(hi),t2=tb.cy-l2.length*lh/2;
      let ok=true;
      l2.forEach((l,i)=>{const hw=half(t2+i*lh,lh);if(!hw||ctx.measureText(l).width>2*hw) ok=false;});
      if(ok) best={lines:l2,top:t2};
    }
    return {size,lh,top:best.top,lines:best.lines};
  }
  // sig'masa: eng kichik o'lchamda asl matn markazida
  ctx.font=FONT(9);
  const l=uniform(Math.max(tb.w*1.2,80));
  return {size:9,lh:10.4,top:tb.cy-l.length*5.2,lines:l};
}

function eraseItem(ctx,it){
  const {b,out,fill}=it;
  const id=ctx.getImageData(b.x0,b.y0,b.bw,b.bh),px=id.data;
  for(let i=0;i<b.bw*b.bh;i++){ if(!out[i]){const p=i*4;px[p]=fill[0];px[p+1]=fill[1];px[p+2]=fill[2];} }
  ctx.putImageData(id,b.x0,b.y0);
}
function drawItem(ctx,it){
  const text=it.upper?it.uz.toUpperCase():it.uz;
  const L=layoutItem(ctx,it,text);if(!L) return;
  ctx.font=FONT(L.size);ctx.fillStyle=it.color;ctx.textAlign='center';ctx.textBaseline='middle';
  L.lines.forEach((l,i)=>ctx.fillText(l,it.b.x0+it.tb.cx,it.b.y0+L.top+i*L.lh+L.lh/2));
}
function render(){
  if(!state) return;
  const {ctx,img,items}=state;
  ctx.drawImage(img,0,0);
  const act=items.filter(it=>it.uz.trim());
  act.forEach(it=>eraseItem(ctx,it));
  act.forEach(it=>drawItem(ctx,it));
}

// ---------- Tahrirlash oynasi ----------
function buildCards(){
  itemsBox.innerHTML='';
  state.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<label></label><textarea class="en"></textarea><button class="mini">Qayta tarjima</button><label>Tarjima (tahrirlash mumkin)</label><textarea class="uz"></textarea>';
    const [l1,l2]=d.querySelectorAll('label'),en=d.querySelector('.en'),uz=d.querySelector('.uz'),btn=d.querySelector('.mini');
    l1.textContent=`${i+1}. Asl matn`;
    en.value=it.en;uz.value=it.uz;
    en.oninput=()=>{it.en=en.value;};
    uz.oninput=()=>{it.uz=uz.value;};
    btn.onclick=async()=>{
      btn.disabled=true;btn.textContent='...';
      const tr=await translate(it.en,state.from,state.to);
      if(tr){it.uz=polish(tr,state.to);uz.value=it.uz;}
      btn.disabled=false;btn.textContent='Qayta tarjima';
    };
    itemsBox.appendChild(d);
  });
}
// ---------- Asosiy jarayon ----------
translateBtn.addEventListener('click',async()=>{
  if(!selectedUrl) return;
  translateBtn.disabled=true;
  resultSection.classList.remove('show');
  itemsBox.innerHTML='';
  const from=sourceLang.value==='eng'?'en':'uz';
  const to=targetLang.value==='eng'?'en':'uz';
  let worker;
  try{
    showStatus('OCR tayyorlanmoqda (birinchi marta uzoq bo‘lishi mumkin)...','loading');
    worker=await Tesseract.createWorker(sourceLang.value,1);
    await worker.setParameters(Object.assign({tessedit_pageseg_mode:'6'},sourceLang.value==='eng'?{tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'’\".,!?-:;… "}:{}));

    const img=(preview.complete&&preview.naturalWidth>0)?preview:await loadImg(selectedUrl);
    const W=img.naturalWidth,H=img.naturalHeight;
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0);

    showStatus('Pufakchalar qidirilmoqda...','loading');
    await sleep(50);
    const {res:bubbles,lab}=findBubbles(ctx,W,H);
    const list=bubbles.filter((a,i)=>!bubbles.some((c,j)=>j!==i&&c.bw*c.bh<a.bw*a.bh&&c.x0>=a.x0&&c.y0>=a.y0&&c.x0+c.bw<=a.x0+a.bw&&c.y0+c.bh<=a.y0+a.bh));
    const items=[],skipped=[];let failed=0;

    for(let n=0;n<list.length;n++){
      showStatus(`Pufakcha ${n+1}/${list.length}...`,'loading');
      const b=list[n];
      const {comp,out}=interiorMask(lab,W,b);
      const id=ctx.getImageData(b.x0,b.y0,b.bw,b.bh);
      const px=id.data,NN=b.bw*b.bh;

      let tx0=b.bw,ty0=b.bh,tx1=0,ty1=0,holes=0,inter=0;
      const cropData=new ImageData(new Uint8ClampedArray(px),b.bw,b.bh);
      for(let i=0;i<NN;i++){
        const p=i*4;
        if(!out[i]) inter++;
        if(out[i]){cropData.data[p]=cropData.data[p+1]=cropData.data[p+2]=255;}
        else if(!comp[i]){
          const x=i%b.bw,y=(i-x)/b.bw;
          holes++;
          if(x<tx0)tx0=x;if(x>tx1)tx1=x;if(y<ty0)ty0=y;if(y>ty1)ty1=y;
        }
      }
      if(holes<40||holes/(inter||1)>0.4){ skipped.push(`@${b.x0},${b.y0} matn yo‘q`); continue; }

      // fon bir xil rangda bo'lishi kerak
      let fillL=255;
      { let k=0,sm=0,sq=0;
        for(let i=0;i<NN;i+=5){ if(comp[i]){const l=lumOf(px,i*4);k++;sm+=l;sq+=l*l;} }
        if(k<50) continue;
        const mean=sm/k;fillL=mean;
        if(Math.sqrt(Math.max(0,sq/k-mean*mean))>28){ skipped.push(`@${b.x0},${b.y0} fon notekis`); continue; }
      }
      // chegarasi qora chiziq bilan o'ralgan bo'lishi kerak
      { const bw=b.bw,bh=b.bh;let tot=0,dk=0;
        const lumAt=(x,y)=>{if(x<0||y<0||x>=bw||y>=bh) return 0;return lumOf(px,(y*bw+x)*4);};
        const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        for(let y=0;y<bh;y+=2){for(let x=0;x<bw;x+=2){
          if(!comp[y*bw+x]) continue;
          for(const [dx,dy] of dirs){
            const nx=x+dx,ny=y+dy;
            if(nx>=0&&ny>=0&&nx<bw&&ny<bh&&comp[ny*bw+nx]) continue;
            tot++; if([1,2,3,4,5].some(k=>lumAt(x+dx*k,y+dy*k)<110)) dk++; break;
          }
        }}
        if(tot<20||dk/tot<0.5){ skipped.push(`@${b.x0},${b.y0} chegara ${(dk/(tot||1)).toFixed(2)}`); continue; }
      }

      // OCR uchun nusxa (3x)
      const c1=document.createElement('canvas');c1.width=b.bw;c1.height=b.bh;
      c1.getContext('2d').putImageData(cropData,0,0);
      const sc=b.bw*3<=2400?3:(b.bw*2<=2400?2:1);
      const c2=document.createElement('canvas');c2.width=b.bw*sc;c2.height=b.bh*sc;
      const c2x=c2.getContext('2d');c2x.imageSmoothingQuality='high';
      c2x.drawImage(c1,0,0,c2.width,c2.height);
      if(fillL>=150){
        const bd=c2x.getImageData(0,0,c2.width,c2.height),T=fillL*0.62;
        for(let i=0;i<bd.data.length;i+=4){
          const v=lumOf(bd.data,i)<T?0:255;
          bd.data[i]=bd.data[i+1]=bd.data[i+2]=v;
        }
        c2x.putImageData(bd,0,0);
      }
      let {data}=await worker.recognize(c2);
      if(data.confidence<55){
        await worker.setParameters({tessedit_pageseg_mode:'11'});
        const r2=await worker.recognize(c2);
        await worker.setParameters({tessedit_pageseg_mode:'6'});
        if(r2.data.confidence>data.confidence) data=r2.data;
      }
      const txt=(data.text||'').replace(/[^\p{L}\p{N}'’ʻ".,!?\-:; \n]/gu,' ').replace(/\s+/g,' ').trim();
      const lettersN=txt.replace(/[^\p{L}]/gu,'').length,alnumN=txt.replace(/[^\p{L}\p{N}]/gu,'').length||1;
      if(data.confidence<(fillL<235?35:20)||lettersN<2||lettersN/alnumN<0.8||!plausible(txt,data)){
        skipped.push(`@${b.x0},${b.y0} ${Math.round(data.confidence)}%:${txt.slice(0,18)}`);continue;
      }

      // 1-qoida: asl matn joyi va o'lchami (OCR qatorlaridan)
      const lines=(data.lines||(data.blocks||[]).flatMap(bk=>(bk.paragraphs||[]).flatMap(p=>p.lines||[])))
        .filter(l=>l.bbox&&(l.words||[]).some(w=>w.confidence>=40));
      let tb,size0;
      if(lines.length){
        const X0=Math.min(...lines.map(l=>l.bbox.x0)),X1=Math.max(...lines.map(l=>l.bbox.x1));
        const Y0=Math.min(...lines.map(l=>l.bbox.y0)),Y1=Math.max(...lines.map(l=>l.bbox.y1));
        tb={cx:(X0+X1)/2/sc,cy:(Y0+Y1)/2/sc,w:(X1-X0)/sc,h:(Y1-Y0)/sc};
        const cs=lines.map(l=>(l.bbox.y0+l.bbox.y1)/2/sc).sort((u,v)=>u-v);
        const hs=lines.map(l=>(l.bbox.y1-l.bbox.y0)/sc).sort((u,v)=>u-v);
        const medH=hs[hs.length>>1];
        if(cs.length>=2){const ds=[];for(let i=1;i<cs.length;i++)ds.push(cs[i]-cs[i-1]);ds.sort((u,v)=>u-v);size0=ds[ds.length>>1]/1.15;}
        else size0=medH/0.72;
      }else{
        tb={cx:(tx0+tx1)/2,cy:(ty0+ty1)/2,w:tx1-tx0+1,h:ty1-ty0+1};size0=tb.h/Math.max(1,txt.split(' ').length/3);
      }
      size0=Math.max(10,Math.min(size0*1.05,b.bh/2));

      // fon rangi (pufakchaning o'zidan)
      const sR=[],sG=[],sB=[];
      for(let i=0;i<NN;i+=5){ if(comp[i]){const p=i*4;sR.push(px[p]);sG.push(px[p+1]);sB.push(px[p+2]);} }
      const md=a=>a.sort((u,v)=>u-v)[a.length>>1]||255;
      const fill=[md(sR),md(sG),md(sB)];

      // 2-qoida: asl matn rangi (fondan eng ko'p farq qiladigan piksellar)
      const cand=[];
      const rx0=Math.max(0,Math.floor(tb.cx-tb.w/2)-6),rx1=Math.min(b.bw-1,Math.ceil(tb.cx+tb.w/2)+6);
      const ry0=Math.max(0,Math.floor(tb.cy-tb.h/2)-6),ry1=Math.min(b.bh-1,Math.ceil(tb.cy+tb.h/2)+6);
      for(let y=ry0;y<=ry1;y++)for(let x=rx0;x<=rx1;x++){
        const i=y*b.bw+x;if(out[i]||comp[i]) continue;
        cand.push([Math.abs(lumOf(px,i*4)-fillL),i*4]);
      }
      cand.sort((u,v)=>v[0]-u[0]);
      let color=fillL>150?'#000':'#fff';
      if(cand.length>=20){
        const k=Math.max(20,Math.floor(cand.length*0.25));let r=0,g=0,bl=0,cs=0;
        for(let j=0;j<k;j++){const p=cand[j][1];r+=px[p];g+=px[p+1];bl+=px[p+2];cs+=cand[j][0];}
        if(cs/k>=50) color=`rgb(${Math.round(r/k)},${Math.round(g/k)},${Math.round(bl/k)})`;
      }

      // pufakchaning chap/o'ng chegarasi (qatorlar bo'yicha)
      const spL=new Int16Array(b.bh).fill(-1),spR=new Int16Array(b.bh).fill(-1);
      for(let y=0;y<b.bh;y++){
        for(let x=0;x<b.bw;x++){ if(!out[y*b.bw+x]){spL[y]=x;break;} }
        for(let x=b.bw-1;x>=0;x--){ if(!out[y*b.bw+x]){spR[y]=x;break;} }
      }

      // tarjima
      const tr=await translate(txt,from,to);
      if(!tr){failed++;continue;}
      const letters=txt.replace(/[^\p{L}]/gu,'');
      const upper=letters.length>0&&letters.replace(/[^\p{Lu}]/gu,'').length/letters.length>=0.7;
      items.push({b,out,fill,color,tb,size0,bw:b.bw,bh:b.bh,sp:{L:spL,R:spR},en:txt,uz:polish(tr,to),upper});
      await sleep(120);
    }
    await worker.terminate();

    state={img,ctx,W,H,items,from,to};
    buildCards();
    render();
    resultSection.classList.add('show');
    if(!items.length) showStatus(`Tarjima qilingan pufakcha topilmadi (${list.length} ta joy tekshirildi)`+(failed?' | tarjima limiti tugagan bo‘lishi mumkin':'')+(skipped.length?` | ${skipped.slice(0,6).join(' ; ')}`:''),'error');
    else showStatus(`${items.length}/${list.length} ta pufakcha tarjima qilindi`+(failed?`, ${failed} tasi tarjimon xatosi sababli qilinmadi`:'')+(skipped.length?` | o‘qilmadi: ${skipped.slice(0,4).join(' ; ')}`:''),'loading');
    resultSection.scrollIntoView({behavior:'smooth'});
  }catch(err){
    console.error(err);
    showStatus('Xatolik: '+err.message,'error');
    if(worker) try{await worker.terminate();}catch(e){}
  }
  translateBtn.disabled=false;
});

$('applyBtn').addEventListener('click',()=>{render();showStatus('Tarjima rasmga qayta joylandi','loading');});
$('downloadBtn').addEventListener('click',()=>{
  canvas.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='tarjima.png';a.click();});
});
sourceLang.addEventListener('change',()=>{targetLang.value=sourceLang.value==='eng'?'uzb':'eng';});
</script>
</body>
</html>
